# =============================================================================
# Title: Train Detector - RF DETR Large 1728x960 Video (1 s and 2 s context)
#
# Description: train_detector_rf_detr_l_1728_video.conf with the two context
# frames taken 1 s and 2 s back instead of 1 and 2 frames back. Seconds are
# converted per sequence with its frame rate (extraction rate for videos, csv
# fps metadata for image folders, else temporal_fallback_rate). Deploy the
# detector at the pipeline rate given by its temporal_frame_rate (default 5).
# =============================================================================

include train_detector_rf_detr_l_1728_video.conf

detector_trainer:ocv_windowed:trainer:rf_detr:temporal_offsets = -1s,-2s
detector_trainer:ocv_windowed:trainer:rf_detr:temporal_fallback_rate = 5

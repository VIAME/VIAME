# RFDETRSegLarge: jointly train boxes, masks, and head/tail keypoints.
include train_detector_netharn_rf_detr_l_1728.conf

block detector_trainer:ocv_windowed

  # The outer trainer's scale operation does not scale named keypoints, so let
  # the netharn sampler transform images, boxes, masks and points together.
  # This only changes what the windowed trainer writes to
  # deep_training/cached_chips; the extracted-frame cache is untouched by it,
  # which is why this recipe shares the default augmented_images with every
  # other one rather than re-extracting the dataset into a private copy.
  mode = disabled

endblock

block detector_trainer:ocv_windowed:trainer

  netharn:segmentation_head = True
  netharn:keypoints = True
  netharn:keypoint_names = head,tail

  # Optional native rf_detr .pth/.pt/.ckpt for weight-only fine-tuning.
  # Match the seed's model size and segmentation architecture.
  netharn:native_seed_model =

  # Fine-tuning defaults; set native_seed_model to the native seg/seg+kp run.
  netharn:max_epochs = 12
  netharn:learning_rate = 5e-5

endblock

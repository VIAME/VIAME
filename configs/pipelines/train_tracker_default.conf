# =============================================================================
# Title: Train Tracker - Default
#
# Description: Trains ByteTrack unless the groundtruth clearly needs frame
# registration: then BoT-SORT with camera motion compensation for moving
# targets, or a pure registration IoU tracker for fixed ground targets (high
# resolution, low frame rate aerial surveys). Writes
# tracking_data_statistics.json with the evidence.
# =============================================================================

include common_train_detector.conf
track_reader:type = viame_csv

tracker_trainer:type = adaptive

block tracker_trainer:adaptive
  max_trainers_to_run = 1

  # Each box is carried to its next state three ways: as-is (iou), by a
  # constant-velocity prediction (motion), and by a camera transform fit to
  # the other tracks (registration). The first that associates at least
  # association_match_rate of pairs at association_match_iou picks the regime.
  # Registration must also beat the prediction by registration_margin, and is
  # "fixed" when targets move under fixed_residual box sizes once registered.
  association_match_iou = 0.3
  association_match_rate = 0.9
  max_ambiguity_rate = 0.05
  registration_min_tracks = 2
  registration_min_coverage = 0.5
  registration_margin = 0.2
  fixed_residual = 0.25

  output_statistics_file = tracking_data_statistics.json
  verbose = true
endblock

# ByteTrack takes every regime but the two registration ones, and runs with
# any amount of data, so it is always the fallback.
block tracker_trainer:adaptive:trainer_1
  association_preference = iou,motion,appearance
endblock

tracker_trainer:adaptive:trainer_1:trainer:type = bytetrack

block tracker_trainer:adaptive:trainer_1:trainer:bytetrack
  identifier = custom_bytetrack_tracker
  train_directory = deep_training
  output_directory = category_models
  output_prefix = bytetrack_tracker
  threshold = 0.00
  min_std_weight_position = 0.01
  max_std_weight_position = 0.5
  min_std_weight_velocity = 0.001
  max_std_weight_velocity = 0.1
endblock

# Absent without the pytorch plugins, leaving ByteTrack alone.
block tracker_trainer:adaptive:trainer_2
  required_min_tracks = 10
  required_min_mean_track_length = 5.0
  association_preference = registration
endblock

tracker_trainer:adaptive:trainer_2:trainer:type = botsort

block tracker_trainer:adaptive:trainer_2:trainer:botsort
  identifier = custom_botsort_cmc_tracker
  train_directory = deep_training
  output_directory = category_models
  output_prefix = botsort_tracker
  gpu_count = -1
  threshold = 0.00
  timeout = 604800
  use_cmc = true
  use_reid = false
endblock

block tracker_trainer:adaptive:trainer_3
  required_min_tracks = 10
  required_min_mean_track_length = 3.0
  association_preference = fixed
endblock

tracker_trainer:adaptive:trainer_3:trainer:type = homog_iou

block tracker_trainer:adaptive:trainer_3:trainer:homog_iou
  identifier = custom_homog_iou_tracker
  train_directory = deep_training
  output_directory = category_models
  output_prefix = homog_iou_tracker
  threshold = 0.00
endblock

relativepath video_extractor = filter_default.pipe

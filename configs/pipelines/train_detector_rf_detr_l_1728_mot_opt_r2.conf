# =============================================================================
# Title: Train Detector - RF DETR Large Seg 1728x960 Motion (Optical Flow), round 2
#
# Description: Continues the 20 epoch OPT-SEG run launched 2026-07-30 12:25 for
# another 20 epochs. Identical data, channels and architecture to
# train_detector_rf_detr_l_1728_mot_opt.conf -- only the resume, the epoch
# budget and the learning-rate schedule differ. Read that file for the rest of
# the reasoning; only the deltas are commented here.
#
# This is a RESUME, not another warm start. Warm-starting a converged
# checkpoint through seed_model keeps only the weights -- the Adam moments and
# the EMA are rebuilt from nothing, and the re-warming transient that follows
# is expensive: the sibling MIM run lost ~0.22 mAP in epoch 0 that way and
# spent all 20 of its epochs climbing back. rf_detr:resume hands the .ckpt to
# trainer.fit(ckpt_path=) instead, so all of it survives the handover.
#
# CHECK ROUND 1 FIRST. The LRs below assume it ended the way MIM did -- still
# gaining when the cosine ran out -- which was true of MIM but is unverified
# here. On the run's log:
#
#   grep -a "Best regular mAP saved" LOG | tail -3
#
# A last save at epoch 17-19 means it was still climbing and these rates are
# right. A last save around epoch 10-12 with nothing after means it had
# genuinely plateaued, and more epochs at 0.7x peak will mostly buy overfitting
# -- prefer a lower base LR, or a different lever than epoch count.
# =============================================================================

include common_train_detector.conf

relativepath pipeline_template = templates/embedded_rf_detr_optical_flow.pipe

default_percent_validation = 0.10
validation_burst_frame_count = 500

#  12, not the 8 the MIM configs use -- seg + flow makes this the slowest of the
#  three runs. Must match round 1 or the train/val split moves under the resume.
downsample = 12

relativepath augmentation_pipeline = train_aug_add_optical_flow.pipe

augmentation_cache = augmented_images

#  Reuse round 1's flow-augmented frames -- WIPE augmented_images first if
#  another config built it. Safe as long as this runs in the OPT-SEG run
#  directory: all three motion configs use this same directory NAME with
#  different channel layouts, and a 4-channel cache read as 3-channel fails
#  silently rather than loudly.
regenerate_cache = false

augmentation_threads = 32


detector_trainer:type = ocv_windowed

block detector_trainer:ocv_windowed

  train_directory = deep_training

  mode = disabled

  chip_width = 1728
  chip_width_step = 1152

  chip_height = 960
  chip_height_step = 640

  chip_adaptive_thresh = 1600000

  min_train_box_length = 1

  image_reader:type = vxl

endblock

block detector_trainer:ocv_windowed:trainer

  type = rf_detr

  rf_detr:model_size = large
  rf_detr:segmentation = True
  rf_detr:device = auto
  rf_detr:num_channels = 4
  rf_detr:resolution = 960x1728
  rf_detr:multi_scale = false
  rf_detr:augmentation = motion_rgb

  #  Continue round 1 rather than warm-starting from its weights. seed_model
  #  doubles as the resume path (the network is built from it before
  #  fit(ckpt_path=) restores into it, so a second path could disagree on
  #  num_classes), and it must be the PyTorch-Lightning .ckpt -- the
  #  checkpoint_best_*.pth files carry weights only, so there is nothing in
  #  them to resume. load_pretrain_weights normalizes the .ckpt format on the
  #  build side (state_dict -> model, strips _orig_mod.), so one path serves
  #  both roles.
  #
  #  Absolute, and NOT relativepath: this points into the run directory, not
  #  into the install tree -- same as round 1's own seed_model. Point it at a
  #  copy taken aside from rf_detr_output/, since a resumed run rewrites
  #  last.ckpt at the end of every epoch.
  rf_detr:resume = true
  rf_detr:seed_model = /data/users/matt.dawkins/Runs/Training-FishTrack-OPT-SEG/seed_models/last_epoch20.ckpt

  rf_detr:batch_size = 4
  rf_detr:grad_accum_steps = 1

  #  ABSOLUTE, not additional. This is PyTorch-Lightning's max_epochs and
  #  trainer.current_epoch keeps counting across a resume, so 40 is what buys
  #  20 more epochs; leaving it at 20 would satisfy the stopping condition
  #  immediately and the job would exit having trained nothing.
  #
  #  At ~2 h/epoch that is ~40 h of training. Check the SLURM time limit -- this
  #  is the run that will hit it first.
  rf_detr:max_epochs = 40

  #  0.7x round 1's peak (1e-4 / 1.5e-4 / 1e-4), which is where its cosine sat
  #  around epochs 5-10. High enough to keep making progress, low enough not to
  #  return a model that has already absorbed 20 epochs of adaptation to the
  #  full peak. The ratios are unchanged, so round 1's relative tuning -- head
  #  to encoder, and the stem pinned level with the head -- still holds.
  rf_detr:learning_rate = 7.0e-5
  rf_detr:learning_rate_encoder = 1.05e-4

  rf_detr:lr_vit_layer_decay = 0.9
  rf_detr:lr_component_decay = 0.85

  #  Still pinned level with learning_rate, off the bottom of the decay ladder
  #  (which would give ~1.7e-5 here). The reason has weakened but not gone: the
  #  4th flow channel's conv rows started from _adapt_input_conv and have now
  #  had 20 epochs at 1e-4 to settle, so if round 2 shows the trunk lagging the
  #  stem this is the first knob to drop back onto the ladder.
  rf_detr:lr_stem = 7.0e-5

  #  Warmup runs again from zero -- VIAME resets the scheduler counter on a
  #  resume -- so this is one epoch of ramp at the handover. Keep it: the
  #  restored optimizer state is matched to an LR of ~0, and stepping a
  #  converged network straight onto peak is the shock this is here to avoid.
  rf_detr:warmup_epochs = 1.0

  #  NOT cosine, unlike round 1. The cosine horizon is derived from max_epochs
  #  (total_steps = trainer.estimated_stepping_batches, which multiplies by
  #  max_epochs and ignores the epochs already completed), but the resume
  #  restarts the schedule counter at zero. A cosine would therefore be laid
  #  out across 40 epochs and only 20 of them run: it would stop halfway down
  #  its own arc, at ~0.52x peak, having never annealed. The step schedule is
  #  measured in epochs from the restart instead, so it means what it says:
  #  13 epochs at the rates above, then 7 at a tenth of them to settle.
  rf_detr:lr_scheduler = step
  rf_detr:lr_drop = 13

  rf_detr:use_ema = True
  rf_detr:ema_decay = 0.9998

  rf_detr:checkpoint_interval = 5

  #  Rebased onto the resume epoch by VIAME, so this ignores epochs 20-22. The
  #  live model dips while warmup ramps back up and the inherited EMA does not,
  #  so without this the pre-resume model can win best-checkpoint selection and
  #  round 2 exports round 1's weights.
  rf_detr:skip_best_epochs = 3

  rf_detr:num_workers = 8
  rf_detr:pin_memory = True
  rf_detr:persistent_workers = False
  rf_detr:prefetch_factor = 3

  rf_detr:val_subsample = 4000
  rf_detr:eval_max_dets = 300

  rf_detr:ddp_timeout = 3600
  rf_detr:timeout = 1209600

endblock

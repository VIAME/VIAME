# =============================================================================
# Title: Interactive Stereo Service Configuration - Epipolar Template Matching
#
# Description: KWIVER flat config for the interactive stereo annotation service.
# Used by python -m viame.core.interactive_stereo for interactive point transfer
# in DIVE stereo annotation mode.
#
# This configuration uses epipolar template matching (the same approach as
# stereo_measure_current_annots_template.pipe). For each point to transfer,
# the epipolar curve is computed from camera calibration and a template patch
# is matched along it using Normalized Cross-Correlation (NCC). This method
# does not require GPU.
#
# DIVE desktop selects between this file, the DINO add-on's
# interactive_stereo_ncc_dino.conf and the Fast Foundation Stereo add-on's
# interactive_stereo_fast_fdn_stereo.conf through its "Stereo point matching"
# setting. Installing the Fast Foundation Stereo add-on also overrides
# interactive_stereo_default.conf with dense disparity
# =============================================================================

matching_method = epipolar_template_matching

# ---------------------------------------------------------------------------
# Template matching parameters
# ---------------------------------------------------------------------------
# Template window size (must be odd). Larger = more robust but slower.
template_size = 13

# Minimum NCC score to accept a match (0-1 range).
template_matching_threshold = 0.5

# ---------------------------------------------------------------------------
# Epipolar search range (disparity-based, in pixels)
# ---------------------------------------------------------------------------
# Disparity is how far a point shifts between left and right images.
# These define the search range along the epipolar curve.
#
# Alternatively, set epipolar_min_depth / epipolar_max_depth in calibration
# units (e.g. mm). Depth parameters are only used when both disparity
# parameters are 0.
epipolar_min_disparity = 2
epipolar_max_disparity = 300
# epipolar_min_depth = 2000
# epipolar_max_depth = 200000

# Number of sample points along the epipolar curve.
epipolar_num_samples = 5000

# ---------------------------------------------------------------------------
# Service settings
# ---------------------------------------------------------------------------
service:scale = 1.0

# ---------------------------------------------------------------------------
# Stereo point-segmentation options
# ---------------------------------------------------------------------------
# In point segmentation mode a polygon is generated on the clicked camera and
# then warped/segmented on the other camera. These options refine that flow.
#
# When true, derive a head/tail line from the polygon on each camera (using the
# add_keypoints_from_mask oriented-bbox algorithm, the same one the measurement
# pipelines use) and generate the length/measurement attributes.
segmentation_generate_line = true

# When true, the other camera's segmentation seed is the coordinate-wise median
# of segmentation_point_samples points sampled inside the source polygon and
# warped across, instead of warping the single clicked point. This reduces
# sensitivity to individual bad point mappings.
segmentation_point_sampling = true

# Number of points to sample when segmentation_point_sampling is enabled.
segmentation_point_samples = 5

# A box, polygon or mask whose area on the other camera is more than this many
# times larger or smaller than the original is refused with a warning instead
# of being mapped. 0 disables the check.
max_transfer_size_ratio = 2.5

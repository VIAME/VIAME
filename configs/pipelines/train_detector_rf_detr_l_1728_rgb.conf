# =============================================================================
# Title: Train Detector - RF DETR Large 1728x960 RGB (boxes)
#
# Description: Box-only variant of the 1728x960 RGB recipe. Identical to
# train_detector_rf_detr_l_seg_1728_rgb.conf -- same resolution, batch,
# learning rates, and every other training hyperparameter -- except
# segmentation is off: this trains RFDETRLarge (boxes only) instead of
# RFDETRSegLarge, and any input polygons are ignored.
#
# Seeds do not cross families: RFDETRLarge is patch_size 16, every RFDETRSeg*
# is 12, so a checkpoint from the seg run cannot warm-start this (nor vice
# versa) and seed_model stays empty to fine-tune from the COCO weights. The
# _mot_mim box config instead warm-starts from a motion seed at global batch
# 32 with sqrt(2)-scaled LRs; this config keeps the seg-RGB tuning (batch 16,
# base LRs) so the two RGB runs differ only in the mask head.
#
# There is no motion/flow augmentation pass, so no augmentation_pipeline is
# set: video inputs fall through to the default extractor (filter_default.pipe)
# at the same 5 fps. The extracted-frame cache is byte-identical to the seg RGB
# config's, so augmented_images can be shared between the two runs.
# Small boxes are retained for small-fish detection.
#
# The batch adapts to the hardware: batch_size = adaptive holds the global
# batch at 16 by sizing the micro-batch from the detected VRAM and accumulating
# for the rest, with AMP (on by default). Without the mask head the box model
# is lighter, so adaptive may resolve a larger micro-batch and fewer
# accumulation steps than the seg run on the same card -- the global batch, and
# therefore the LRs, are unchanged.
# The network input is 1728x960 (height 960, width 1728): a near-16:9 shape
# that preserves the aspect ratio of the source footage instead of squashing it
# into a square. Both dims are divisible by the large model's
# patch_size*num_windows = 32 constraint (54 x 30 blocks).
# =============================================================================

include common_train_detector.conf

#  Pipeline template file. Plain RGB deploy template (no motion/flow infusion).
relativepath pipeline_template = templates/embedded_default.pipe

#  Override default validation percentage
default_percent_validation = 0.10

#  Longer validation bursts than the shared default, matched to the seg and
#  motion runs so the train/val split lands on the same frames: 500 frames
#  (~17s at 30fps) per burst decorrelates each validation burst from the
#  training footage around it, instead of the default 10-frame slivers that
#  score memorization on 30fps video.
validation_burst_frame_count = 500

#  Every 3rd extracted frame. At 5 fps neighbours are 0.2s apart and near
#  duplicates; this widens spacing to 0.6s -- denser than the seg run's 8 for
#  more optimizer steps per epoch. Applied after the validation split
#  (tools/train.cxx) so train/val membership matches downsample = 0.
downsample = 3

#  Augmentatation cache.
augmentation_cache = augmented_images

#  Reuse cached frames -- WIPE augmented_images first if another config built it.
regenerate_cache = false

#  Algorithm to use for 'detector_trainer'.
detector_trainer:type = ocv_windowed

block detector_trainer:ocv_windowed

  # Directory for all files used in training
  train_directory = deep_training

  # Windowing mode, can be disabled, maintain_ar, scale, chip, adaptive
  mode = disabled

  # Chip geometry, unused while mode = disabled (the full frame is passed through
  # and RF-DETR does the resize). Kept aligned with the network input shape.
  chip_width = 1728
  chip_width_step = 1152

  chip_height = 960
  chip_height_step = 640

  # Adaptive size threshold for chipping
  chip_adaptive_thresh = 1600000

  # Keep small boxes -- small fish are the target, so do not filter or remove
  # small detections during training.
  min_train_box_length = 1
  #small_box_area = 200
  #small_action = remove

  # Image reader type
  image_reader:type = vxl

endblock

block detector_trainer:ocv_windowed:trainer

  # Trainer type
  type = rf_detr

  # The model variant (base, large, small, medium, nano)
  rf_detr:model_size = large

  # Box-only detector (RFDETRLarge): input polygons are ignored. Set True for
  # RFDETRSegLarge (masks + boxes) -- see the header before flipping it.
  rf_detr:segmentation = False

  # Plain RGB: num_channels defaults to 3, so it is left unset.

  # Device to train on (auto, cpu, cuda, cuda:N)
  rf_detr:device = auto

  # Network input resolution, as HEIGHTxWIDTH. Both dims must be divisible by
  # 32 for the large model; 960x1728 satisfies that. A non-square value feeds
  # the network aspect-preserving imagery; RF-DETR resizes to exactly this
  # shape (no windowing, no black bars).
  rf_detr:resolution = 960x1728

  # Off: with it on the CPU resizes every image to the TOP of the jitter ladder
  # (1120x2016, not the 960x1728 above) and the GPU re-interpolates each batch
  # back down to a random scale -- 1.36x the pixel cost on every image, for an
  # average the GPU already sees at the base size.
  rf_detr:multi_scale = false

  # Augmentation preset. "default" is RF-DETR's built-in (horizontal flip + the
  # DETR multi-scale resize) -- crucially NO vertical flip, which is correct for
  # this up-is-up footage. Do NOT switch to the "aggressive"/"aerial" presets:
  # both add a vertical flip and manufacture upside-down fish the model never
  # sees at inference. "conservative"/"industrial" add mild photometric jitter
  # (also no vertical flip) if a stronger baseline is wanted.
  rf_detr:augmentation = default

  # Path to seed weights. Leave empty to fine-tune from RF-DETR's default
  # COCO-pretrained weights. Seg checkpoints (patch 12) cannot seed this
  # patch-16 model.
  rf_detr:seed_model =

  # The micro-batch is PER-DEVICE and the learning rate is never scaled by world
  # size, so what the LR actually sees is
  #     batch_size * grad_accum_steps * num_gpus
  # adaptive sizes the micro-batch from the detected VRAM and derives
  # grad_accum_steps to hold that product at the target below, so the run keeps
  # the global batch of 16 its LR is tuned for whatever it lands on.
  #
  # 16 rather than 32: matched to the seg RGB run rather than the mot_mim box
  # recipe, so the seg/box comparison shares its tuning. Accumulating back to
  # 32 would also halve the optimizer-step count per epoch, and step count is
  # what this model is short of, not batch size.
  rf_detr:batch_size = adaptive
  rf_detr:auto_batch_target_effective = 16

  # Matched to the seg and motion configs. Deliberately short for a fast first
  # pass; cosine anneals to 0 across it.
  rf_detr:max_epochs = 20

  # RF-DETR's tuned base LRs, which assume a global batch of 16 -- exactly the
  # global batch above, so no rescaling is applied (the mot_mim box recipe
  # scaled these up by sqrt(2) for its global batch of 32). sqrt, not linear,
  # scaling: DETR training is unstable at high LR.
  rf_detr:learning_rate = 1e-4
  rf_detr:learning_rate_encoder = 1.5e-4

  # The head is re-initialized to a single class, so the first few hundred steps
  # push large gradients through a mostly-pretrained network. Ramp in.
  rf_detr:warmup_epochs = 0.25

  # LR schedule. The default "step" schedule drops at lr_drop = 100, which never
  # fires in a run this length. Cosine anneals to 0 across max_epochs.
  rf_detr:lr_scheduler = cosine

  # EMA decay is applied per optimizer step, so the averaging horizon is
  # ~1/(1-decay) steps. Matched to the seg and motion runs.
  rf_detr:use_ema = True
  rf_detr:ema_decay = 0.9998

  # Checkpointing
  rf_detr:checkpoint_interval = 5

  # Host memory scales as ranks * num_workers * prefetch_factor * batch_size;
  # 8 workers/rank OOMed a 125 GB node.
  rf_detr:num_workers = 4
  rf_detr:pin_memory = True
  rf_detr:persistent_workers = False
  rf_detr:prefetch_factor = 2

  # Full validation OOMed the host; run a full eval on the final best
  # checkpoint for the headline number.
  rf_detr:val_subsample = 4000
  rf_detr:eval_max_dets = 300

  # Seconds a DDP rank may lag the others before the NCCL watchdog aborts every
  # rank with SIGABRT. 0 keeps PyTorch-Lightning's 30-minute default, which is
  # short enough that one slow rank (a checkpoint write to network storage, a
  # long eval) takes down a multi-day run. Note the ranks that report the
  # timeout are the victims: the culprit is whichever rank is MISSING from the
  # error. This only buys a slow-but-alive rank more room -- a true deadlock
  # still dies, just this many seconds later, idling every GPU until it does.
  rf_detr:ddp_timeout = 3600

  # Max timeout in seconds (default = 1209600, or two weeks)
  rf_detr:timeout = 1209600

endblock

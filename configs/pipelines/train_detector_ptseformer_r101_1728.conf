# =============================================================================
# Title: Train Detector - PTSEFormer ResNet-101 1728x960 Video (boxes)
#
# Description: Video detector (PTSEFormer, ECCV 2022). A Deformable-DETR style
# network encodes each training frame together with reference frames from the
# same sequence, enhances the frame's features with theirs, and decodes its
# queries alongside the references' queries. Requires temporally ordered input
# frames. The trained detector keeps the encoded features of the frames it has
# already seen and uses those as references, so it deploys with the plain
# single-image template and only ever looks at past frames.
# =============================================================================

include common_train_detector.conf

#  Pipeline template file.
relativepath pipeline_template = templates/embedded_default.pipe

#  Override default validation percentage
default_percent_validation = 0.10

#  Matched to the RF-DETR video runs so the split lands on the same frames.
validation_burst_frame_count = 500

#  Neighbouring frames at 5 fps are near duplicates. The frames in between
#  stay on disk and are read as reference frames.
downsample = 8

#  Augmentatation cache, shareable with the RF-DETR RGB configs.
augmentation_cache = augmented_images

#  Reuse cached frames -- WIPE augmented_images first if another config built it.
regenerate_cache = false

#  Algorithm to use for 'detector_trainer'.
detector_trainer:type = ocv_windowed

block detector_trainer:ocv_windowed

  # Directory for all files used in training
  train_directory = deep_training

  # Windowing mode, can be disabled, maintain_ar, scale, chip, adaptive
  mode = disabled

  # Unused while mode = disabled; the trainer does the resize.
  chip_width = 1728
  chip_width_step = 1152

  chip_height = 960
  chip_height_step = 640

  # Adaptive size threshold for chipping
  chip_adaptive_thresh = 1600000

  # Keep small boxes -- small fish are the target.
  min_train_box_length = 1

  # Image reader type
  image_reader:type = vxl

endblock

block detector_trainer:ocv_windowed:trainer

  # Trainer type
  type = ptseformer

  # The backbone the released checkpoint uses (resnet50 is lighter).
  ptseformer:backbone = resnet101

  # Upstream's query count; each reference frame adds as many to the decoder.
  ptseformer:num_queries = 100

  # HEIGHTxWIDTH. Near 16:9 keeps the source aspect; matches the RF-DETR runs.
  ptseformer:resolution = 960x1728

  # The method's own sampling: two reference frames drawn at random from the
  # window for every training sample. Past frames only, so the detector can
  # run online; 0.6 s is 3 frames at 5 fps, about what upstream's 12 frames
  # span at 25-30 fps. For fixed references set temporal_offsets = -1,-2.
  ptseformer:temporal_offsets =
  ptseformer:reference_window = -0.6s,0s
  ptseformer:num_reference_frames = 2

  # Off: the reference frames feed the enhancement stages without a backward
  # pass through the backbone and encoder: about 10 GB at this resolution. On
  # is upstream's behaviour and needs roughly 18 GB.
  ptseformer:reference_grad = false

  # Same gradients at about half the memory.
  ptseformer:gradient_checkpointing = true

  # Device to train on (auto, cpu, cuda, cuda:N); auto uses every visible GPU.
  ptseformer:device = auto
  ptseformer:devices = auto

  # The released ImageNet-VID model: every layer but the class head loads.
  # Without it, seed from models/resnet101-63fe2227.pth (backbone only).
  relativepath ptseformer:seed_model = models/ptseformer_r101_vid.pth

  # Frames per optimizer step over all GPUs, by gradient accumulation; the
  # network takes one key frame at a time. Upstream trains at 8.
  ptseformer:batch_size = 8

  # Matched to the RF-DETR video configs.
  ptseformer:max_epochs = 20

  # Upstream's ResNet-101 rates, with its 10x drop kept at 80% of the run.
  ptseformer:learning_rate = 1e-4
  ptseformer:learning_rate_backbone = 1e-5
  ptseformer:lr_drop = 16

  # No vertical flip: up-is-up footage. Upstream uses no augmentation at all.
  ptseformer:horizontal_flip = 0.5

  # Host RAM scales as GPUs * num_workers.
  ptseformer:num_workers = 4

  # Bound validation; full-eval the final checkpoint for a headline number.
  ptseformer:val_subsample = 2000

  # Max timeout in seconds (default = 1209600, or two weeks)
  ptseformer:timeout = 1209600

endblock

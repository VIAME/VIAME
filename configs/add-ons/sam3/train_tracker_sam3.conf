# =============================================================================
# Title: Train Tracker - SAM 3.1
#
# Description: Fine-tunes SAM 3.1 for text-query tracking: first the detector
# (finds every instance of the text query in a frame), then the multiplex
# tracker (memory attention, memory encoder, mask decoders, object pointers)
# on ground-truth tracks with polygon annotations. Both share a frozen vision
# backbone. Produces a full SAM 3.1 checkpoint and a tracker pipeline built
# from templates/tracker_sam3.pipe (same as tracker_sam3_fish.pipe).
# =============================================================================

# Example usage:
#   viame train -i /path/to/training/data -c train_tracker_sam3.conf \
#     --tracker sam3
#
# (Pass the config with -c: with --tracker alone the run trains, but the
# output directory and pipeline template set here are not applied.)
#
# Training data must be tracks (consistent track ids across frames) with
# polygon annotations. The tracker skips tracks with boxes only unless
# box_targets is enabled, since box-shaped targets teach box-shaped masks;
# the detector stage trains on boxes either way.
#
# To fine-tune only the tracker, for use with another detector, use
# train_tracker_sam3_tracker_only.conf instead.

# Track reader configuration
track_reader:type = viame_csv

# Tracker trainer configuration
tracker_trainer:type = sam3

# Model identifier for output files
tracker_trainer:sam3:identifier = viame-sam3-tracker

# SAM 3.1 checkpoint to fine-tune (must be a 3.1 multiplex checkpoint)
relativepath tracker_trainer:sam3:sam_model_id = models/sam3.1_weights.pt

# Directory for intermediate training files
tracker_trainer:sam3:train_directory = deep_training

# Number of GPUs to use (-1 for all visible). More than one launches DDP
# ranks in a child interpreter; this needs NCCL.
tracker_trainer:sam3:gpu_count = -1

# Tracker optimization. One iteration is one clip per GPU. On FishTrack23
# most of the gain came in the first ~1500 iterations (2 GPUs); the best
# checkpoint by validation is the one exported.
tracker_trainer:sam3:max_iterations = 4000
tracker_trainer:sam3:learning_rate = 2e-5
tracker_trainer:sam3:weight_decay = 0.05
tracker_trainer:sam3:warmup_iterations = 300

# Clip sampling: frames per clip, and objects tracked per clip. Eight objects
# at 1008 px fits a 24 GB GPU; clips that still run out of memory are skipped.
tracker_trainer:sam3:clip_length = 8
tracker_trainer:sam3:max_objects = 8

# Validation (held-out sequences; validation_fraction of the training
# sequences when no validation data is given)
tracker_trainer:sam3:eval_every = 500
tracker_trainer:sam3:eval_clips = 300
tracker_trainer:sam3:validation_fraction = 0.1

# Data loading workers per GPU
tracker_trainer:sam3:num_workers = 4

# Train on box-shaped masks for tracks without polygons
tracker_trainer:sam3:box_targets = false

# Detector stage: fine-tune the SAM 3.1 detector on every annotated frame of
# the training tracks before the tracker (see train_detector_sam3.conf). Set
# to false to leave the detector exactly as in sam_model_id.
tracker_trainer:sam3:train_detector = true
tracker_trainer:sam3:detector_max_iterations = 3000
tracker_trainer:sam3:detector_learning_rate = 5e-5
tracker_trainer:sam3:detector_batch_size = 1
tracker_trainer:sam3:detector_eval_images = 500

# Text query the detector is trained with, also written into the generated
# pipeline for detecting new objects
tracker_trainer:sam3:text_query = fish

# Training timeout in seconds (default: 1 week)
tracker_trainer:sam3:timeout = 604800

# Output
output_directory = trained_model
output_file = trained_model.zip
relativepath tracker_pipeline_template = templates/tracker_sam3.pipe
output_tracker_pipeline_name = tracker.pipe

# =============================================================================
# Data preparation
# =============================================================================

#  Pipeline to use to extract video frames if inputs are videos. The built-in
#  default for this setting is "ffmpeg", which is not a pipeline file, so
#  without this line every video extraction aborts with "The file does not
#  exist: ffmpeg" and training is handed zero frames.
relativepath video_extractor = filter_default.pipe

# =============================================================================
# Title: Train Detector - RF DETR Large Seg + Keypoints 1728x960 RGB
#
# Description: Adds a head/tail keypoint head to a box+mask RFDETRSegLarge
# checkpoint trained by train_detector_rf_detr_l_seg_1728.conf, and
# fine-tunes the whole network on the same data so it predicts boxes, masks and
# keypoints together. Data preparation (frame extraction, 960x1728 whole-frame
# input, validation split) matches the seg config; downsample is 6 rather than 8,
# and the frame cache and train/val membership still carry over.
#
# SEED
#   rf_detr:seed_model must point at the seg run's .pth (trained_model.pth or
#   checkpoint_best_total.pth). The keypoint head has no weights in that file
#   and starts from random init; everything else loads. It is a warm-start,
#   not a resume: a .pth carries no optimizer state, and the head is new. The
#   trainer silently falls back to the COCO weights when the path is missing,
#   so pass it explicitly (-s ...:seed_model=) and check the startup log for
#   "keypoint" parameters left at random init and nothing else.
#
# KEYPOINTS
#   The groundtruth CSVs must carry "(kp) head x y" / "(kp) tail x y" entries
#   in the attribute columns; annotations without them train as absent slots
#   and contribute nothing to the keypoint loss. Keypoint training runs on the
#   CPU augmentation backend (the default here), which transforms keypoints
#   along with boxes and masks.
#
# Inference: the deployed detector does not yet emit keypoints (rf_detr_detector
# / predict() drop pred_keypoints); that is a separate plugin change.
# =============================================================================

include common_train_detector.conf

relativepath pipeline_template = templates/embedded_default.pipe

default_percent_validation = 0.10

# Validation bursts matched to the seg config; downsample is applied after the
# split, so train/val membership still lines up despite the denser stride.
validation_burst_frame_count = 500
downsample = 6

augmentation_cache = augmented_images
regenerate_cache = false

detector_trainer:type = ocv_windowed

block detector_trainer:ocv_windowed

  train_directory = deep_training

  mode = disabled

  chip_width = 1728
  chip_width_step = 1152

  chip_height = 960
  chip_height_step = 640

  chip_adaptive_thresh = 1600000

  # Keep small boxes: small fish are the target.
  min_train_box_length = 1

  image_reader:type = vxl

endblock

block detector_trainer:ocv_windowed:trainer

  type = rf_detr

  rf_detr:model_size = large
  rf_detr:segmentation = True

  # Head/tail keypoint head alongside boxes and masks. Order fixes the COCO
  # keypoint slots; names match the CSV (kp) labels case-insensitively.
  rf_detr:keypoints = True
  rf_detr:keypoint_names = head,tail

  rf_detr:device = auto
  rf_detr:resolution = 960x1728
  rf_detr:multi_scale = false

  # No vertical flip: up-is-up footage. Do not switch to aggressive/aerial.
  rf_detr:augmentation = default

  # The box+mask .pth from train_detector_rf_detr_l_seg_1728.conf. Set on
  # the command line; see the SEED note above.
  rf_detr:seed_model =

  rf_detr:batch_size = adaptive
  rf_detr:auto_batch_target_effective = 16

  # A converged seed plus one new head needs far fewer epochs than the 20 the
  # seg run took from COCO. Cosine anneals to 0 across this.
  rf_detr:max_epochs = 12

  # Warm-start rates: half the from-scratch decoder/head LR so the random-init
  # keypoint head can learn quickly, with the already-tuned backbone held
  # lower so it adapts rather than drifts.
  rf_detr:learning_rate = 5e-5
  rf_detr:learning_rate_encoder = 2.5e-5

  # The new head pushes large gradients through a converged network at first.
  rf_detr:warmup_epochs = 0.5

  rf_detr:lr_scheduler = cosine

  rf_detr:use_ema = True
  rf_detr:ema_decay = 0.9998

  rf_detr:checkpoint_interval = 4

  # Warmup holds the weights near the seed through epoch 0, so the early EMA
  # would win best-checkpoint selection and the run would export its seed.
  rf_detr:skip_best_epochs = 3

  # CPU augmentation plus mask + keypoint targets per sample; keep the loaders
  # near CPUs-per-GPU (32 / 4 on the training node).
  rf_detr:num_workers = 8
  rf_detr:pin_memory = True
  rf_detr:persistent_workers = False
  rf_detr:prefetch_factor = 2

  rf_detr:val_subsample = 4000
  rf_detr:eval_max_dets = 300

  rf_detr:ddp_timeout = 3600
  rf_detr:timeout = 1209600

endblock

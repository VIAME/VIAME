# =============================================================================
# Title: Train Detector - YOLOV++ Large 1728x960 Video (boxes)
#
# Description: Video detector. A YOLOX-L base detector is fine-tuned on the
# training frames, then frozen while the YOLOV++ head learns to re-score each
# frame's proposals by attention over the proposals of other frames of the
# same sequence. Both stages run in this one training call. Requires input
# frames grouped in per-sequence folders. The trained detector keeps the
# features of past frames itself, so it deploys with the plain single-image
# template.
# =============================================================================

include common_train_detector.conf

#  Pipeline template file.
relativepath pipeline_template = templates/embedded_default.pipe

#  Override default validation percentage
default_percent_validation = 0.10

#  Matched to the RF-DETR video runs so the split lands on the same frames.
validation_burst_frame_count = 500

#  Neighbouring frames at 5 fps are near duplicates. The frames in between
#  stay on disk; they are only read when yolov:temporal_offsets is set.
downsample = 8

#  Augmentatation cache, shareable with the RF-DETR RGB configs.
augmentation_cache = augmented_images

#  Reuse cached frames -- WIPE augmented_images first if another config built it.
regenerate_cache = false

#  Algorithm to use for 'detector_trainer'.
detector_trainer:type = ocv_windowed

block detector_trainer:ocv_windowed

  # Directory for all files used in training
  train_directory = deep_training

  # Windowing mode, can be disabled, maintain_ar, scale, chip, adaptive
  mode = disabled

  # Unused while mode = disabled; the trainer letterboxes the frames.
  chip_width = 1728
  chip_width_step = 1152

  chip_height = 960
  chip_height_step = 640

  # Adaptive size threshold for chipping
  chip_adaptive_thresh = 1600000

  # Keep small boxes -- small fish are the target.
  min_train_box_length = 1
  #small_box_area = 200
  #small_action = remove

  # Image reader type
  image_reader:type = vxl

endblock

block detector_trainer:ocv_windowed:trainer

  # Trainer type
  type = yolov

  # YOLOX variant underneath (s, m, l, x). Upstream ships YOLOV++ for s and l.
  yolov:model_size = l

  # COCO-pretrained YOLOX-L, fine-tuned in stage 1. A local file: nothing is
  # downloaded at train time. Get it from
  # https://github.com/Megvii-BaseDetection/YOLOX/releases/download/0.1.1rc0/yolox_l.pth
  relativepath yolov:seed_model = models/yolox_l.pth

  # Set to the base_best.pth of an earlier run to skip stage 1 and train only
  # the video head on that base detector.
  yolov:base_model =

  # Device to train on (auto, cuda, cuda:N). One GPU.
  yolov:device = auto

  # HEIGHTxWIDTH; must divide by 32. Near 16:9 keeps the source aspect.
  yolov:resolution = 960x1728

  # Empty: the method's own sampling -- each frame is aggregated with random
  # labelled frames of its sequence in training, and with a random draw of
  # past frames at inference. Set offsets ("-1,-2" frames or "-1s,-2s") to
  # aggregate with exactly those past frames instead, read from disk unlabelled.
  yolov:temporal_offsets =

  # Past frames the detector aggregates with, drawn from the last memory_frames
  # (24 s at 5 fps). Upstream uses 31 of the last 600 at video frame rate.
  yolov:reference_frames = 15
  yolov:memory_frames = 120

  # Proposals per frame given to the video head. Upstream leaves the top end
  # unbounded, which does not fit a crowded 960x1728 frame in attention memory.
  yolov:max_proposals = 200

  # Stage 1, the still-image base detector. With amp a 960x1728 frame costs
  # about 2.2 GB on top of 0.6 GB (measured at batch 1 and 2), so 4 fits 16 GB.
  yolov:base_epochs = 14
  yolov:base_batch_size = 4
  yolov:base_warmup_epochs = 1
  yolov:base_no_aug_epochs = 2

  # Stage 2, the video head on the frozen base: 16 frames of one sequence per
  # batch, as upstream, which warns against fewer than 4. Only the head keeps
  # activations: about 2.5 GB for 8 frames (measured), under 5 GB expected here.
  yolov:video_epochs = 6
  yolov:video_frames_per_batch = 16

  # YOLOX's rates per image; multiplied by the batch sizes above.
  yolov:base_lr_per_image = 0.00015625
  yolov:video_lr_per_image = 0.00003125

  # Mosaic keeps its scale range tight and mixup is off: both shrink or blend
  # away fish that are already small and low in contrast.
  yolov:mosaic_prob = 1.0
  yolov:mosaic_scale = 0.5,1.5
  yolov:mixup_prob = 0.0

  # No rotation: up-is-up footage.
  yolov:degrees = 0.0

  # Multi-scale off: +-160 px at this size costs memory for little gain.
  yolov:base_multiscale_range = 0
  yolov:video_multiscale_range = 0

  # Schools of fish exceed YOLOX's default of 120 boxes per frame.
  yolov:max_labels = 300

  yolov:use_ema = True
  yolov:amp = True

  # Host RAM scales as num_workers * frames per batch.
  yolov:num_workers = 4

  # Bound validation; full-eval the final checkpoint for a headline number.
  yolov:val_max_frames = 4000

  # Max timeout in seconds (default = 1209600, or two weeks)
  yolov:timeout = 1209600

endblock

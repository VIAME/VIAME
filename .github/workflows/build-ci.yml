# CI for the single build
#
# VIAME used to build its dependencies as ExternalProjects, so this workflow
# was built around that: three staged caches keyed on the hashes of
# `add_project_fletch.cmake`, `add_project_kwiver.cmake` and
# `add_project_pytorch.cmake`, and a build that ran `--target fletch`, then
# `--target python-deps`, then `--target kwiver`, then `--target pytorch`,
# then `--target viame`. There is one configure and one build now, and none
# of those targets exists.
#
# What is left to cache is compiler output, which is what ccache is for.

name: CI Build

on:
  push:
    branches: [ main, lite ]
  pull_request:
    branches: [ main, lite ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: Linux CI Build
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # The whole list, and it is the whole list: a compiler, CMake, git and
      # python with its headers. See examples/building_from_source/README.rst.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ cmake ninja-build git zip wget curl \
            python3 python3-dev python3-numpy python3-pip

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux-${{ github.job }}

      # CPU only, and without the options whose packages are built from
      # source: this job is here to catch a build break, and mmcv alone would
      # spend most of the time budget.
      #
      # `VIAME_INSTALL_PYTHON_DEPS=ON` is the point of the job as much as the
      # compile is. It installs `cpu.lock` and `test.lock` and then runs the
      # patch step, so a lock that does not resolve, a pin that has been
      # yanked, or a patch that has stopped matching its package all fail
      # here rather than on somebody's machine. Verified locally in a
      # throwaway prefix: 409 of 409 UNIT and CORE tests pass on a build
      # whose python came only from these locks.
      - name: Configure
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DVIAME_ENABLE_CUDA:BOOL=OFF \
            -DVIAME_ENABLE_CUDNN:BOOL=OFF \
            -DVIAME_ENABLE_PYTHON:BOOL=ON \
            -DVIAME_ENABLE_PYTORCH:BOOL=OFF \
            -DVIAME_ENABLE_ONNX:BOOL=OFF \
            -DVIAME_ENABLE_DARKNET:BOOL=OFF \
            -DVIAME_ENABLE_COLMAP:BOOL=OFF \
            -DVIAME_ENABLE_DIVE:BOOL=OFF \
            -DVIAME_ENABLE_TESTS:BOOL=ON \
            -DVIAME_DOWNLOAD_MODELS:BOOL=OFF \
            -DVIAME_INSTALL_PYTHON_DEPS:BOOL=ON

      - name: Build
        run: cmake --build build -j $(nproc)

      - name: Install
        run: cmake --install build

      # UNIT and CORE, not BASELINE. The compatibility baseline is the
      # contract for the **full** option set -- it lists every algorithm and
      # process VIAME provides -- so a CPU build with pytorch and onnx off
      # fails it by construction, on the names those options would have
      # registered. Checked rather than assumed: `-L BASELINE` on this
      # configuration fails `baseline:registry` and `baseline:pipes`. The
      # release build runs the full set, and that is where the contract
      # belongs.
      - name: Test
        run: ctest --test-dir build -L "UNIT|CORE" --output-on-failure -j 2

  build-windows:
    name: Windows CI Build
    runs-on: windows-2025
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - uses: ilammy/msvc-dev-cmd@v1

      # Same shape as the Linux job and the same reasoning about which
      # options are on. No ctest: P10-T03 is where Windows gets its own pass,
      # and this job is here to catch a build break in the meantime.
      - name: Configure
        run: |
          cmake -S . -B build `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DVIAME_ENABLE_CUDA:BOOL=OFF `
            -DVIAME_ENABLE_CUDNN:BOOL=OFF `
            -DVIAME_ENABLE_PYTHON:BOOL=ON `
            -DVIAME_ENABLE_PYTORCH:BOOL=OFF `
            -DVIAME_ENABLE_ONNX:BOOL=OFF `
            -DVIAME_ENABLE_DARKNET:BOOL=OFF `
            -DVIAME_ENABLE_COLMAP:BOOL=OFF `
            -DVIAME_ENABLE_DIVE:BOOL=OFF `
            -DVIAME_ENABLE_TESTS:BOOL=OFF `
            -DVIAME_DOWNLOAD_MODELS:BOOL=OFF `
            -DVIAME_INSTALL_PYTHON_DEPS:BOOL=OFF

      - name: Build
        run: cmake --build build

  # The Linux job installs `cpu.lock` for real, so a lock that does not
  # resolve fails there. What that cannot catch is a lock the *other*
  # accelerators cannot resolve, and an exclusion that has quietly stopped
  # holding. Both are seconds to check and neither needs a build.
  locks:
    name: Python dependency locks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Resolve every lock
        run: |
          python -m pip install --upgrade pip
          for lock in python/requirements/*.lock; do
            echo "--- $lock"
            python -m pip install --no-deps --dry-run -r "$lock"
          done

      # The exclusions are load bearing. opencv-python and
      # opencv-python-headless each install a cv2 into the same directory as
      # the contrib wheel VIAME uses, and whichever lands last wins.
      - name: Check the exclusions held
        run: |
          for pkg in opencv-python opencv-python-headless triton wandb decord; do
            if grep -qE "^${pkg}==" python/requirements/*.lock; then
              echo "ERROR: ${pkg} is pinned in a lock file; it is on the"
              echo "exclusion list in python/requirements/README.md"
              exit 1
            fi
          done
          echo "no excluded package is pinned"

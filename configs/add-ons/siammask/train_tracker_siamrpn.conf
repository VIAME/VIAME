# =============================================================================
# Title: Train Tracker - Siammask
#
# Description: Configuration for training SIAMMASK object tracker. Learns
# motion models and appearance features for multi-object tracking.
# =============================================================================

# SiamRPN++ Tracker Training Configuration
#
# This configuration file is used with viame when training
# a SiamRPN++ tracker using the --tracker/-tt option.
#
# Example usage:
#   viame train -i /path/to/training/data -tt siamrpn
#
# Or with a custom config:
#   viame train -i /path/to/training/data -c train_siamrpn_tracker.conf

# Track reader configuration
# The track reader is used to load groundtruth track annotations
track_reader:type = viame_csv

# Tracker trainer configuration
tracker_trainer:type = siamrpn

# Model identifier for output files
tracker_trainer:siamrpn:identifier = custom_siamrpn_tracker

# Path to SiamRPN++ architecture config file (YAML)
# Leave empty to use default config
relativepath tracker_trainer:siamrpn:config_file = models/siamrpn_default.yaml

# Optional pre-trained weights to initialize from
tracker_trainer:siamrpn:seed_model =

# Directory for intermediate training files
tracker_trainer:siamrpn:train_directory = deep_training

# Directory for final trained model output
tracker_trainer:siamrpn:output_directory = category_models

# Prefix for output model files
tracker_trainer:siamrpn:output_prefix = siamrpn_tracker

# Number of GPUs to use (-1 for auto-detect)
# Devices to train across. Training is launched through
# torch.distributed.run with one worker per device, so -1 takes every device
# the process can see and the launcher decides how many that is. There is no
# "auto" here; -1 is the auto value, since this is parsed as an integer.
# batch_size is per worker, so the effective batch scales with the count.
tracker_trainer:siamrpn:gpu_count = -1

# Maximum training epochs
tracker_trainer:siamrpn:max_epochs = 20

# Batch size (auto for automatic selection based on GPU memory)
tracker_trainer:siamrpn:batch_size = auto

# Crop size for training samples (511 is standard for SiamRPN++)
tracker_trainer:siamrpn:crop_size = 511

# Confidence threshold for groundtruth filtering
tracker_trainer:siamrpn:threshold = 0.00

# Skip the data cropping step (use if crop data already exists)
tracker_trainer:siamrpn:skip_crop = false

# Training timeout in seconds (default: 2 weeks)
tracker_trainer:siamrpn:timeout = 1209600

# =============================================================================
# Data preparation
# =============================================================================

#  Pipeline to use to extract video frames if inputs are videos. The built-in
#  default for this setting is "ffmpeg", which is not a pipeline file, so
#  without this line every video extraction aborts with "The file does not
#  exist: ffmpeg" and training is handed zero frames.
relativepath video_extractor = filter_default.pipe

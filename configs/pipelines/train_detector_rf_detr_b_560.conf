# =============================================================================
# Title: Train Detector - RF DETR Base 560
#
# Description: Configuration for training RF-DETR. Uses the RF-DETR base
# model. Input resolution: 560px.
# =============================================================================

include common_train_detector.conf

#  Pipeline template file.
relativepath pipeline_template = templates/embedded_default.pipe

#  Override default validation percentage
default_percent_validation = 0.10

#  Augmentation pipeline.
#relativepath augmentation_pipeline = train_hue_shifting_only_aug.pipe

#  Augmentatation cache.
augmentation_cache = augmented_images

#  Reuse cached frames. Missing sequences re-extract; partial ones do not.
regenerate_cache = false


#  Algorithm to use for 'detector_trainer'. Common settings live in
#  common_train_rf_detr.conf; override individual keys after the include.
detector_trainer:type = ocv_windowed

block detector_trainer:ocv_windowed

  include common_train_rf_detr.conf

  # Windowing mode, can be disabled, maintain_ar, scale, chip, adaptive
  mode = disabled

  # Chip geometry, unused while mode = disabled (the full frame is passed
  # through and RF-DETR does the resize). Kept aligned with the 560px network.
  chip_width = 560
  chip_step_width = 375
  chip_height = 560
  chip_step_height = 375

  # Don't train on chips with detections smaller than this
  min_train_box_length = 5

  # Image reader type
  image_reader:type = vxl

  # The model variant (base, large, small, medium, nano)
  trainer:rf_detr:model_size = base

  # Network perspective field size (RF-DETR base default is 560)
  trainer:rf_detr:chip_width = 560

  trainer:rf_detr:max_epochs = 50

endblock


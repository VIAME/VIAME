# =============================================================================
# Title: Train Detector - SAM 3.1
#
# Description: Fine-tunes the SAM 3.1 detector -- the open-vocabulary model
# that finds every instance of a text query -- on box and polygon
# annotations, with SAM 3's own training objective (Hungarian matching,
# box/GIoU, presence-aware focal and mask losses). The vision backbone and
# text encoder stay frozen, so a SAM 3.1 tracker fine-tuned on the same
# backbone stays valid. Produces a full SAM 3.1 checkpoint and a per-image
# detector pipeline.
# =============================================================================

# Example usage:
#   viame train -i /path/to/training/data -c train_detector_sam3.conf
#
# All labels are merged into the one text query below. Polygons train the
# mask head; box-only annotations still train detection.

include common_train_detector.conf

#  Pipeline template file.
relativepath pipeline_template = templates/embedded_default.pipe

#  Algorithm to use for 'detector_trainer'.
detector_trainer:type = sam3

block detector_trainer:sam3

  # Model identifier for output files
  identifier = viame-sam3-detector

  # SAM 3.1 checkpoint to fine-tune (must be a 3.1 multiplex checkpoint)
  relativepath sam_model_id = models/sam3.1_weights.pt

  # Directory for intermediate training files
  train_directory = deep_training

  # Number of GPUs to use (-1 for all visible). More than one launches DDP
  # ranks in a child interpreter; this needs NCCL.
  gpu_count = -1

  # Text query the detector is trained (and deployed) with
  text_query = fish

  # Optimization. One iteration is batch_size images per GPU.
  max_iterations = 3000
  learning_rate = 8e-5
  weight_decay = 0.1
  warmup_iterations = 200
  batch_size = 4

  # Validation: AP over held-out images every eval_every iterations; the
  # checkpoint with the best AP (IoU 0.5:0.95) is exported, and deployed at
  # the score threshold that maximized F1
  eval_every = 500
  eval_images = 500

  # Held-out fraction of image folders / videos when no validation data is
  # given
  validation_fraction = 0.1

  # Data loading workers per GPU
  num_workers = 4

  # Run the trained heads in fp16
  amp = true

  # Training timeout in seconds (default: 1 week)
  timeout = 604800

endblock

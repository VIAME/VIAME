[build-system]
requires = ["setuptools>=65.6.3,<74", "wheel", "scikit-build", "cmake", "ninja", "pygccxml==3.0.2", "castxml==0.4.5", "pybind11-stubgen"]
[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
# Add to get all the output of the tests
#   "-s",
]
minversion = "6.0"
# Relative to this file, which P11-T02b moved into `packaging/` along with
# the rest of what `python/` held that was packaging rather than code. The
# test packages followed the code they test into `library/`.
#
# `tools/demo_python_impl_call.py` was here and is not: it had already been
# deleted from the tree, and naming a file pytest cannot find is how a suite
# ends up collecting nothing without saying so.
testpaths = [
    "../../library/core_types/tests/python",
    "../../library/pipeline_framework/tests/python",
    "../../tools/tests",
]

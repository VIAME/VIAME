# =============================================================================
# Title: Train Detector - RF DETR Large Seg 720 (90 GB / high-core box)
#
# Description: Same adaptive-windowing SEGMENTATION recipe as
# train_detector_rf_detr_l_728.conf (RFDETRSegLarge, masks + boxes, 720px),
# retuned for a machine with ~90 GB VRAM and many CPU cores. Scaled up relative
# to the 24 GB config:
#   1. chip_threads          1  -> 32   (parallel chip generation; the biggest
#                                        data-prep win -- was the serial bottleneck)
#   2. augmentation_threads  16 -> 32   (parallel video-frame extraction)
#   3. batch_size            2  -> 8    (seg is heavy, but 90 GB fits a bigger
#                                        micro-batch; grad_accum 2 -> effective 16)
#
# TUNING NOTES
#   * Set chip_threads and augmentation_threads to the box's PHYSICAL core count
#     (32 is a placeholder). They run in separate phases, so each can use all
#     cores. Make sure the scheduler actually grants that many CPUs
#     (Slurm: --cpus-per-task >= these values) or the threads get capped.
#   * Segmentation is much heavier than detection. batch_size 8 is a conservative
#     start for 90 GB at 720px seg; raise it (and drop grad_accum_steps) while
#     watching VRAM, scaling the LR by ~sqrt(effective_batch/16) if you go well
#     past effective 16. Validation is pinned to batch 1 for seg automatically.
#   * Resolution/chip is 720 (=24*30), the seg-large divisibility requirement.
#   * DISK: adaptive chipping of a large video set produces millions of chips.
#     Frames + chips can be hundreds of GB (PNG) or ~3x less as JPG. If disk is
#     tight, set chip_format = jpg below (frames are written PNG by the stock
#     code; JPG frame output requires a local code tweak to extract_video_frames).
# =============================================================================

include common_train_detector.conf

#  Pipeline template file.
relativepath pipeline_template = templates/embedded_default.pipe

#  Override default validation percentage
default_percent_validation = 0.10

#  Augmentation pipeline.
#relativepath augmentation_pipeline = train_hue_shifting_only_aug.pipe

#  Augmentatation cache.
augmentation_cache = augmented_images

#  Regenerate the cache (decode video frames + rebuild chips).
regenerate_cache = true

#  (2) Worker threads for the concurrent video-frame extraction pass. Set to the
#  machine's physical core count.
augmentation_threads = 32


#  Algorithm to use for 'detector_trainer'.
detector_trainer:type = ocv_windowed

block detector_trainer:ocv_windowed

  # Directory for all files used in training
  train_directory = deep_training

  # Windowing mode, can be disabled, maintain_ar, scale, chip, adaptive
  mode = adaptive

  # (1) Parallel chip generation. Safe with the OpenCV writer (the old serial
  # default was a workaround for the now-fixed vxl heap-corruption crash). Set
  # to the machine's physical core count.
  chip_threads = 32

  # Chip tile size = 720 (divisible by 24 for seg-large). NOTE: the code reads
  # chip_step_width / chip_step_height (the older chip_width_step /
  # chip_height_step keys were silently ignored and defaulted to 500).
  chip_width = 720
  chip_step_width = 480

  # Chip tile height = 720 (seg-large divisibility, see above).
  chip_height = 720
  chip_step_height = 480

  # Adaptive size threshold for chipping
  chip_adaptive_thresh = 1600000

  # Don't train on chips with detections smaller than this
  min_train_box_length = 5

  # Uncomment to remove small detections instead of training on them
  small_box_area = 75
  small_action = remove

  # Chip output format. Uncomment to write JPG chips (~3x less disk than PNG).
  #chip_format = jpg

  # Image IO type. ocv, not vxl: the vxl writer corrupts the heap over long
  # runs (crashing chip generation and video-frame extraction).
  image_reader:type = ocv

endblock

block detector_trainer:ocv_windowed:trainer

  # Trainer type
  type = rf_detr

  # The model variant (base, large, small, medium, nano)
  rf_detr:model_size = large

  # Train the segmentation (mask) model RFDETRSegLarge -- learns masks + boxes
  # from the input polygons. Set False for a box-only detector.
  rf_detr:segmentation = True

  # Device to train on (auto, cpu, cuda, cuda:N)
  rf_detr:device = auto

  # Network input resolution. Must be divisible by 24 for seg-large (720=24*30).
  rf_detr:resolution = 720

  # Network perspective field size
  rf_detr:chip_width = 720

  # Path to pretrained weights
  rf_detr:seed_model =

  #  Pipeline template file.
  #relativepath rf_detr:pipeline_template = templates/embedded_default.pipe

  # (3) Seg micro-batch sized for ~90 GB at 720px (segmentation is far heavier
  # than detection). 8 x grad_accum 2 = effective 16. Raise batch_size while
  # watching VRAM; validation is auto-pinned to batch 1 for seg.
  rf_detr:batch_size = 8
  rf_detr:grad_accum_steps = 2
  rf_detr:max_epochs = 20

  # DataLoader worker processes per rank. Raise toward the core count to keep the
  # (now larger) batches fed.
  rf_detr:num_workers = 8

  # Training learning rate. Kept at the fine-tuning-safe values; if you raise
  # batch_size well beyond 32, scale these up by ~sqrt(batch/32).
  rf_detr:learning_rate = 1e-4
  rf_detr:learning_rate_encoder = 1.5e-4

  # The head is re-initialized to the new class count, so the first few hundred
  # steps push large gradients through an otherwise-pretrained network. Ramp in.
  rf_detr:warmup_epochs = 0.25

  # LR schedule. Without this the trainer falls back to "step", which drops the LR
  # once at lr_drop = 100 -- an epoch this run never reaches, so the LR would hold
  # at its peak from the first step to the last and never anneal. Cosine decays
  # smoothly to 0 across max_epochs, whatever max_epochs happens to be.
  rf_detr:lr_scheduler = cosine

  # EMA settings
  rf_detr:use_ema = True
  rf_detr:ema_decay = 0.993

  # Checkpointing
  rf_detr:checkpoint_interval = 10

  # Max timeout in seconds (default = 1209600, or two weeks)
  rf_detr:timeout = 1209600

endblock

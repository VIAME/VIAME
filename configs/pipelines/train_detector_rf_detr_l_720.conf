# =============================================================================
# Title: Train Detector - RF DETR Large 720 (boxes)
#
# Description: Trains the RF-DETR large BOX detector with adaptive windowing:
# frames larger than chip_adaptive_thresh are tiled into 720px chips (preserving
# small-object resolution on high-res/video footage), smaller frames pass whole.
# Video clips are decoded to frames up front, concurrently across
# augmentation_threads workers.
#
# HARDWARE
#   * rf_detr:batch_size = adaptive sizes the micro-batch from the VRAM of the
#     smallest visible GPU and derives grad_accum_steps so the GLOBAL batch
#     (micro-batch x grad_accum x GPUs) still lands on
#     auto_batch_target_effective, which is what the learning rates below are
#     tuned for. The same file therefore runs on an 8 GB card and on a 4 x 90 GB
#     node without edits, and trains at the same global batch on both. The
#     resolved numbers are printed at startup on the "batch_size = adaptive:"
#     line; more VRAM buys fewer accumulation steps, not a bigger batch.
#   * All visible GPUs are used automatically (DDP). Pin rf_detr:device = cuda:N
#     to train on one of them instead.
#   * If a card OOMs anyway, set rf_detr:gradient_checkpointing = True (roughly
#     halves activation memory, ~30% slower) -- adaptive accounts for it.
#
# BOX vs SEGMENTATION
#   * rf_detr:segmentation is False here: RFDETRLarge, boxes only, and input
#     polygons are ignored. Set it True for RFDETRSegLarge (masks + boxes), and
#     then also set rf_detr:resolution = 720, since the two variants have
#     different divisibility requirements (see below).
#   * Box-large requires resolution divisible by patch_size * num_windows = 32,
#     so the network runs at 704 (= 32*22, its pretrained native size) while
#     chips stay 720; seg-large needs a multiple of 24, which is what 720 is.
#   * Changing the CHIP size needs a fresh chip cache (regenerate_cache already
#     rebuilds it; otherwise clear deep_training first). Changing only the
#     network resolution does not.
# =============================================================================

include common_train_detector.conf

#  Pipeline template file.
relativepath pipeline_template = templates/embedded_default.pipe

#  Override default validation percentage
default_percent_validation = 0.10

#  Augmentation pipeline.
#relativepath augmentation_pipeline = train_hue_shifting_only_aug.pipe

#  Augmentatation cache.
augmentation_cache = augmented_images

#  Reuse cached frames -- WIPE augmented_images first if another config built it.
regenerate_cache = false

#  Worker threads for the concurrent video-frame extraction pass.
augmentation_threads = 16


#  Algorithm to use for 'detector_trainer'.
detector_trainer:type = ocv_windowed

block detector_trainer:ocv_windowed

  # Directory for all files used in training
  train_directory = deep_training

  # Windowing mode, can be disabled, maintain_ar, scale, chip, adaptive
  mode = adaptive

  # Serial chip generation (1 worker). Safe default; can be raised now that the
  # writer is OpenCV rather than vxl.
  chip_threads = 1

  # Chip tile size. NOTE: the code reads chip_step_width / chip_step_height
  # (the older chip_width_step / chip_height_step keys were silently ignored
  # and defaulted to 500).
  chip_width = 720
  chip_step_width = 480

  # Chip tile height.
  chip_height = 720
  chip_step_height = 480

  # Adaptive size threshold for chipping
  chip_adaptive_thresh = 1400000

  # Don't train on chips with detections smaller than this
  min_train_box_length = 2

  # Uncomment to remove small detections instead of training on them
  small_box_area = 20
  small_action = remove

  # Image IO type. ocv, not vxl: the vxl writer corrupts the heap over long
  # runs (crashing chip generation and video-frame extraction).
  image_reader:type = ocv

endblock

block detector_trainer:ocv_windowed:trainer

  # Trainer type
  type = rf_detr

  # The model variant (base, large, small, medium, nano)
  rf_detr:model_size = large

  # Box-only detector (RFDETRLarge). True selects RFDETRSegLarge and learns
  # masks + boxes from the input polygons -- see the header before flipping it.
  rf_detr:segmentation = False

  # Device to train on (auto, cpu, cuda, cuda:N). auto = every visible GPU, DDP.
  rf_detr:device = auto

  # Network input resolution. Must be divisible by 32 for box-large; 704 is its
  # pretrained native size, so the 720px chips are resized 720 -> 704.
  rf_detr:resolution = 704

  # Network perspective field size
  rf_detr:chip_width = 720

  # Path to pretrained weights
  rf_detr:seed_model =

  #  Pipeline template file.
  #relativepath rf_detr:pipeline_template = templates/embedded_default.pipe

  # Micro-batch sized from the detected VRAM, with grad_accum_steps derived to
  # hit the global effective batch below. Replace with a fixed integer (plus
  # rf_detr:grad_accum_steps) to pin it, or "auto" to have RF-DETR probe the
  # real model instead of estimating from the card size.
  rf_detr:batch_size = adaptive
  rf_detr:auto_batch_target_effective = 16

  # Trade compute for memory: recompute backbone activations in the backward
  # pass. Only needed on small cards, which adaptive already sizes down for.
  rf_detr:gradient_checkpointing = False

  rf_detr:max_epochs = 25

  # Training learning rate, tuned for the effective batch of 16 above. It is
  # never scaled by world size, which is why adaptive pins the GLOBAL batch
  # rather than the per-GPU one.
  rf_detr:learning_rate = 1e-4
  rf_detr:learning_rate_encoder = 1.5e-4

  # The head is re-initialized to the new class count, so the first few hundred
  # steps push large gradients through an otherwise-pretrained network. Ramp in.
  rf_detr:warmup_epochs = 0.25

  # LR schedule. Without this the trainer falls back to "step", which drops the LR
  # once at lr_drop = 100 -- an epoch this run never reaches, so the LR would hold
  # at its peak from the first step to the last and never anneal. Cosine decays
  # smoothly to 0 across max_epochs, whatever max_epochs happens to be.
  rf_detr:lr_scheduler = cosine

  # EMA settings
  rf_detr:use_ema = True
  rf_detr:ema_decay = 0.993

  # Checkpointing
  rf_detr:checkpoint_interval = 10

  # Max timeout in seconds (default = 1209600, or two weeks)
  rf_detr:timeout = 1209600

endblock

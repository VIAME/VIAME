# =============================================================================
# Title: Interactive Stereo - Fast Foundation Stereo
#
# Description: Fast-Foundation-Stereo ONNX export for disparity estimation.
# Requires GPU.
# =============================================================================

# ---- Stereo Algorithm -------------------------------------------------------

compute_stereo_depth_map:type = fast_foundation_stereo_onnx

# ---- Model Parameters -------------------------------------------------------

relativepath compute_stereo_depth_map:fast_foundation_stereo_onnx:model_path = models/fast_foundation_stereo_l.onnx
relativepath compute_stereo_depth_map:fast_foundation_stereo_onnx:config_path = models/fast_foundation_stereo_l.yaml
compute_stereo_depth_map:fast_foundation_stereo_onnx:backend = auto
compute_stereo_depth_map:fast_foundation_stereo_onnx:device = auto
compute_stereo_depth_map:fast_foundation_stereo_onnx:output_mode = disparity
compute_stereo_depth_map:fast_foundation_stereo_onnx:remove_invisible = true

# ---- Service Settings --------------------------------------------------------

service:scale = 1.0

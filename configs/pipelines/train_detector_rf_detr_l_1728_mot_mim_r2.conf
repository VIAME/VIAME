# =============================================================================
# Title: Train Detector - RF DETR Large 1728x960 Motion (MIM), round 2
#
# Description: Continues the 20 epoch mot_mim run of 2026-07-30 for another 20
# epochs. Identical data, channels and architecture to
# train_detector_rf_detr_l_1728_mot_mim.conf -- only the resume, the epoch
# budget and the learning-rate schedule differ. Read that file for the rest of
# the reasoning; only the deltas are commented here.
#
# Why another 20: round 1 was still climbing when its cosine ran out. Live mAP
# 50:95 went 0.4393 (epoch 0) -> 0.5697 (epoch 19), gaining ~0.010/epoch as
# late as epoch 14 and only flattening over the last three, which is the LR
# reaching zero rather than the model converging. checkpoint_best_regular.pth
# was rewritten as late as epoch 18. It also has not yet recovered the seed's
# own 0.6613 on this validation set, so there is a known target to clear.
#
# This is a RESUME, not another warm start. Round 1 lost ~0.22 mAP in epoch 0
# re-warming from a converged checkpoint through seed_model, because that path
# keeps only the weights: the Adam moments and the EMA are rebuilt from
# nothing. rf_detr:resume hands the .ckpt to trainer.fit(ckpt_path=) instead,
# so all of that survives and there is no crater at the handover.
# =============================================================================

include common_train_detector.conf

relativepath pipeline_template = templates/embedded_rf_detr_motion.pipe

default_percent_validation = 0.10
validation_burst_frame_count = 500
downsample = 8

relativepath augmentation_pipeline = train_aug_add_double_motion.pipe

augmentation_cache = augmented_images

#  Reuse round 1's augmented frames. They were built by this same config's
#  channel layout and round 1 verified them, so there is nothing left to prove
#  by rebuilding -- and extraction of the 504 items cost 3.5 hours of the ~14.5
#  hour job, against ~33 min/epoch of actual training.
regenerate_cache = false

augmentation_threads = 32


detector_trainer:type = ocv_windowed

block detector_trainer:ocv_windowed

  train_directory = deep_training

  mode = disabled

  chip_width = 1728
  chip_width_step = 1152

  chip_height = 960
  chip_height_step = 640

  chip_adaptive_thresh = 1600000

  min_train_box_length = 1

  image_reader:type = vxl

endblock

block detector_trainer:ocv_windowed:trainer

  type = rf_detr

  rf_detr:model_size = large
  rf_detr:segmentation = False
  rf_detr:device = auto
  rf_detr:resolution = 960x1728
  rf_detr:multi_scale = false
  rf_detr:augmentation = motion_grey

  #  Continue round 1 rather than warm-starting from its weights. seed_model
  #  doubles as the resume path (the network is built from it before
  #  fit(ckpt_path=) restores into it, so a second path could disagree on
  #  num_classes), and it must be the PyTorch-Lightning .ckpt -- the
  #  checkpoint_best_*.pth files carry weights only.
  #
  #  Absolute, and NOT relativepath: this points into the run directory, not
  #  into the install tree. Point it at a copy taken aside from round 1's
  #  output, since a resumed run rewrites last.ckpt at the end of every epoch.
  rf_detr:resume = true
  rf_detr:seed_model = /data/users/matt.dawkins/Runs/Training-FishTrack-MOT-MIM/seed_models/last_epoch20.ckpt

  rf_detr:batch_size = 8
  rf_detr:grad_accum_steps = 1

  #  ABSOLUTE, not additional. This is PyTorch-Lightning's max_epochs and
  #  trainer.current_epoch keeps counting across a resume, so 40 is what buys
  #  20 more epochs; leaving it at 20 would satisfy the stopping condition
  #  immediately and the job would exit having trained nothing.
  rf_detr:max_epochs = 40

  #  ~0.7x round 1's peak (1.5e-4 / 2e-4 / 7.5e-5), which is where its cosine
  #  sat around epochs 5-10 -- high enough to keep making the ~0.010/epoch
  #  progress it was still making at epoch 14, without returning a model that
  #  has already absorbed 20 epochs of adaptation to the full peak of a
  #  schedule that cratered it once. The ratios between the three are
  #  unchanged, so the relative tuning round 1 established still holds.
  rf_detr:learning_rate = 1.0e-4
  rf_detr:learning_rate_encoder = 1.4e-4
  rf_detr:lr_stem = 5.0e-5

  rf_detr:lr_vit_layer_decay = 0.9
  rf_detr:lr_component_decay = 0.85

  #  Warmup runs again from zero -- VIAME resets the scheduler counter on a
  #  resume -- so this is one epoch of ramp at the handover. Keep it: the
  #  restored optimizer state is matched to an LR of ~0, and stepping a
  #  converged network straight onto 1.0e-4 is the shock this is here to avoid.
  rf_detr:warmup_epochs = 1.0

  #  NOT cosine, unlike round 1. The cosine horizon is derived from max_epochs
  #  (total_steps = trainer.estimated_stepping_batches, which multiplies by
  #  max_epochs and ignores the epochs already completed), but the resume
  #  restarts the schedule counter at zero. A cosine would therefore be laid
  #  out across 40 epochs and only 20 of them run: it would stop halfway down
  #  its own arc, at ~0.52x peak, having never annealed. The step schedule is
  #  measured in epochs from the restart instead, so it means what it says:
  #  13 epochs at the rates above, then 7 at a tenth of them to settle.
  rf_detr:lr_scheduler = step
  rf_detr:lr_drop = 13

  rf_detr:use_ema = True
  rf_detr:ema_decay = 0.9998

  rf_detr:checkpoint_interval = 5

  #  Rebased onto the resume epoch by VIAME, so this ignores epochs 20-22. The
  #  live model dips while warmup ramps back up and the inherited EMA does not,
  #  so without this the pre-resume model can win best-checkpoint selection and
  #  round 2 exports round 1's weights -- which is exactly how round 1 came to
  #  export its own seed.
  rf_detr:skip_best_epochs = 3

  rf_detr:num_workers = 4
  rf_detr:pin_memory = True
  rf_detr:persistent_workers = False
  rf_detr:prefetch_factor = 2

  rf_detr:val_subsample = 4000
  rf_detr:eval_max_dets = 300

  rf_detr:ddp_timeout = 3600
  rf_detr:timeout = 1209600

endblock

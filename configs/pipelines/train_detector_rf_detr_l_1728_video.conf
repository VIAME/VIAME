# =============================================================================
# Title: Train Detector - RF DETR Large 1728x960 Video (boxes)
#
# Description: Video detector. Each training frame is given to the network
# with its two preceding frames; all three go through the shared backbone and
# the feature maps are fused before the decoder. The fusion starts as an
# identity, so the single-frame seed below keeps its accuracy at step 0 and the
# run only has to learn what the extra frames add. Requires temporally ordered
# input frames. The trained detector buffers past frames itself, so it deploys
# with the plain single-image template.
# =============================================================================

include common_train_detector.conf

#  Pipeline template file.
relativepath pipeline_template = templates/embedded_default.pipe

#  Override default validation percentage
default_percent_validation = 0.10

#  Matched to the seg and motion runs so the split lands on the same frames.
validation_burst_frame_count = 500

#  Neighbouring frames at 5 fps are near duplicates. The frames in between
#  stay on disk and are read as temporal context.
downsample = 8

#  Augmentatation cache, shareable with the seg RGB config.
augmentation_cache = augmented_images

#  Reuse cached frames -- WIPE augmented_images first if another config built it.
regenerate_cache = false

#  Algorithm to use for 'detector_trainer'.
detector_trainer:type = ocv_windowed

block detector_trainer:ocv_windowed

  # Directory for all files used in training
  train_directory = deep_training

  # Windowing mode, can be disabled, maintain_ar, scale, chip, adaptive
  mode = disabled

  # Unused while mode = disabled; RF-DETR does the resize.
  chip_width = 1728
  chip_width_step = 1152

  chip_height = 960
  chip_height_step = 640

  # Adaptive size threshold for chipping
  chip_adaptive_thresh = 1600000

  # Keep small boxes -- small fish are the target.
  min_train_box_length = 1
  #small_box_area = 200
  #small_action = remove

  # Image reader type
  image_reader:type = vxl

endblock

block detector_trainer:ocv_windowed:trainer

  # Trainer type
  type = rf_detr

  # The model variant (base, large, small, medium, nano)
  rf_detr:model_size = large

  # Box-only RFDETRLarge; input polygons are ignored.
  rf_detr:segmentation = False

  # The two preceding frames ride along with each training frame. Past frames
  # only, so the detector can run online from a frame buffer.
  rf_detr:temporal_offsets = -1,-2

  # Off: the extra frames feed the fusion layers without a backward pass, which
  # keeps memory near the single-frame cost. On costs about 3x the activations.
  rf_detr:temporal_context_grad = false

  # Device to train on (auto, cpu, cuda, cuda:N)
  rf_detr:device = auto

  # HEIGHTxWIDTH; must divide by 32. Near 16:9 keeps the source aspect.
  rf_detr:resolution = 960x1728

  # Off: the CPU-side jitter resize costs more than it buys.
  rf_detr:multi_scale = false

  # No vertical flip: up-is-up footage. Do not switch to aggressive/aerial.
  rf_detr:augmentation = default

  # Single-frame RGB fish model of the same architecture; the fusion layers are
  # new and start as an identity on top of it. For a run that must not have
  # seen some sequences (held-out folds), seed from a model trained without
  # them, or from models/rf-detr-large-2026.pth (COCO).
  relativepath rf_detr:seed_model = models/fish_rf_detr_box_1728.pth
  rf_detr:seed_model_url_fallback = False

  # The seed is converged, so its epoch-0 EMA would otherwise win selection.
  rf_detr:skip_best_epochs = 1

  # Global batch 16 matches the seg RGB run so the comparison shares its tuning.
  rf_detr:batch_size = adaptive
  rf_detr:auto_batch_target_effective = 16

  # Matched to the seg and motion configs.
  rf_detr:max_epochs = 20

  # RF-DETR's base LRs, tuned for a global batch of 16.
  rf_detr:learning_rate = 1e-4
  rf_detr:learning_rate_encoder = 1.5e-4

  # The head is re-initialized to one class, so ramp the first steps in.
  rf_detr:warmup_epochs = 0.25

  # "step" drops at epoch 100 and never fires in a run this length.
  rf_detr:lr_scheduler = cosine

  # Per optimizer step; the horizon is ~1/(1-decay) steps.
  rf_detr:use_ema = True
  rf_detr:ema_decay = 0.9998

  # Checkpointing
  rf_detr:checkpoint_interval = 5

  # Host RAM scales as ranks * num_workers * prefetch_factor * batch_size.
  rf_detr:num_workers = 4
  rf_detr:pin_memory = True
  rf_detr:persistent_workers = False
  rf_detr:prefetch_factor = 2

  # Bound validation; full-eval the final checkpoint for a headline number.
  rf_detr:val_subsample = 4000
  rf_detr:eval_max_dets = 300

  # Seconds a rank may lag before the NCCL watchdog aborts every rank.
  rf_detr:ddp_timeout = 3600

  # Max timeout in seconds (default = 1209600, or two weeks)
  rf_detr:timeout = 1209600

endblock

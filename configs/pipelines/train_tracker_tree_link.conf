# =============================================================================
# Title: Train Tracker - TreeLink
#
# Description: Configuration for training the TreeLink object tracker. Fits a
# gradient-boosted link scorer and the tracker's gates from groundtruth tracks.
# =============================================================================

# Example usage:
#   viame train -i /path/to/training/data --tracker tree_link \
#     -s tracker_trainer:tree_link:computed_detections=/path/to/detection/csvs
#
# computed_detections is a folder of detector output over the same clips, one
# VIAME CSV per clip named after it. Without it the scorer is fitted on the
# groundtruth boxes and the gates keep their defaults.

# Shared frame extraction and groundtruth reading
include common_train_detector.conf
track_reader:type = viame_csv

# Tracker trainer configuration
tracker_trainer:type = tree_link

# Model identifier for output files
tracker_trainer:tree_link:identifier = custom_tree_link_tracker

# Directory for intermediate training files
tracker_trainer:tree_link:train_directory = deep_training

# Directory for final trained model output
tracker_trainer:tree_link:output_directory = trained_model

# Prefix for output model files
tracker_trainer:tree_link:output_prefix = tree_link_tracker

# Confidence threshold for groundtruth filtering
tracker_trainer:tree_link:threshold = 0.00

# Detections scoring below this are left out of the training pairs
tracker_trainer:tree_link:min_score = 0.1

# Longest gap, in frames, a link is trained to bridge
tracker_trainer:tree_link:max_gap = 15

# Search the gates by tracking every clip with a scorer fitted on the other
# half of the clips (needs computed_detections)
tracker_trainer:tree_link:search_parameters = true

# Clips to track per candidate, 0 for all of them
tracker_trainer:tree_link:search_max_sequences = 0

# Objective: mean of these metrics, pooled over the clips rather than per clip
tracker_trainer:tree_link:search_metrics = mota,idf1
tracker_trainer:tree_link:search_pooled = true

# A gate only moves for a gain above this
tracker_trainer:tree_link:search_min_gain = 0.0005

# Processes tracking clips during the search, 0 picks from the CPU count
tracker_trainer:tree_link:search_workers = 0

# =============================================================================
# Data preparation
# =============================================================================

#  Pipeline to use to extract video frames if inputs are videos
relativepath video_extractor = filter_default.pipe

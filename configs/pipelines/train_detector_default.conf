# =============================================================================
# Title: Train Detector - Default
#
# Description: Picks one detector for the data and trains it. The adaptive
# trainer measures the groundtruth, gates each candidate on what it needs, and
# runs only the best-scoring one.
#
# Branches, in the order considered:
#   svm       tiny problem the stock detector already finds objects in
#   kp        groundtruth carries head/tail keypoints
#   seg       groundtruth carries polygons or masks
#   1728      high-resolution imagery
#   704       everything else
#
# Track groundtruth also trains a bytetrack tracker, written as tracker.pipe.
# =============================================================================

include common_train_detector.conf

#  Pipeline templates; the tracker, when trained, becomes its own tracker.pipe.
relativepath pipeline_template = templates/embedded_default.pipe
relativepath tracker_pipeline_template = templates/embedded_tracker.pipe

#  Override default validation percentage
default_percent_validation = 0.10

#  Augmentatation cache.
augmentation_cache = augmented_images
regenerate_cache = false

#  Only when the annotations are actually tracks, not one-state detections.
auto_train_tracker = bytetrack
auto_train_tracker_min_track_length = 2.0

block tracker_trainer:bytetrack
  identifier = custom_bytetrack_tracker
  train_directory = deep_training
  output_directory = category_models
  output_prefix = bytetrack_tracker
  threshold = 0.00
  min_std_weight_position = 0.01
  max_std_weight_position = 0.5
  min_std_weight_velocity = 0.001
  max_std_weight_velocity = 0.1
endblock

track_reader:type = viame_csv

detector_trainer:type = adaptive

block detector_trainer:adaptive

  max_trainers_to_run = 1

  small_object_threshold = 1024
  large_object_threshold = 16384
  low_annotation_threshold = 500
  high_annotation_threshold = 2000
  tall_aspect_threshold = 0.7
  wide_aspect_threshold = 1.4
  sparse_frame_threshold = 5
  crowded_frame_threshold = 20
  rare_class_threshold = 50
  dominant_class_threshold = 500
  edge_margin_fraction = 0.05
  overlap_iou_threshold = 0.3
  output_statistics_file = training_data_statistics.json
  verbose = true

  # Images sampled to establish the source resolution the branches gate on.
  image_sample_count = 25

  # Only probe the stock detector when the problem is small enough for svm.
  generic_probe_max_annotations = 100
  generic_probe_max_frames = 25
  generic_probe_iou = 0.3

  generic_probe_image_reader:type = vxl

  # Mirrors add-ons/generic/common_generic_detector.pipe; needs that add-on.
  block generic_probe_detector
    type = windowed
    block windowed
      mode = adaptive
      original_to_chip_size = true
      chip_width = 704
      chip_height = 704
      chip_step_width = 480
      chip_step_height = 480
      chip_adaptive_thresh = 1400000
      scale = 1.0
      black_pad = false
      detector:type = rf_detr
      block detector:rf_detr
        model_size = large
        device = auto
        relativepath weight = models/generic_rf_detr_704.pth
        num_channels = 3
        resolution = 704x704
        segmentation = false
      endblock
    endblock
  endblock

endblock

# -----------------------------------------------------------------------------
# 1. SVM over the stock detector's proposals, when the probe finds the objects.
block detector_trainer:adaptive:trainer_1
  required_max_total_annotations = 100
  required_min_generic_recall = 0.5
  annotation_count_preference = low
  object_size_preference = medium
  density_preference = sparse

  # The svm chain has no single detector slot for the stock tracker template.
  relativepath tracker_pipeline_template = templates/embedded_generic_svm_tracker.pipe
endblock

detector_trainer:adaptive:trainer_1:trainer:type = svm

block detector_trainer:adaptive:trainer_1:trainer:svm
  mode = detector
  gt_frames_only = false
  relativepath pipeline_template = templates/embedded_generic_svm.pipe
  output_directory = category_models/svm
endblock

# -----------------------------------------------------------------------------
# 2. Keypoints, checked before seg since the model also learns boxes and masks.
block detector_trainer:adaptive:trainer_2
  required_keypoints = true
  required_min_count_per_class = 50
  annotation_count_preference = medium
endblock

detector_trainer:adaptive:trainer_2:trainer:type = ocv_windowed

block detector_trainer:adaptive:trainer_2:trainer:ocv_windowed
  include common_train_rf_detr.conf
  train_directory = deep_training/rf_detr_seg_kp
  mode = disabled
  chip_width = 1728
  chip_height = 960
  min_train_box_length = 1
  image_reader:type = vxl
  trainer:rf_detr:model_size = large
  trainer:rf_detr:segmentation = True
  trainer:rf_detr:keypoints = True
  trainer:rf_detr:keypoint_names = head,tail
  trainer:rf_detr:resolution = 960x1728
  trainer:rf_detr:multi_scale = false
  trainer:rf_detr:max_epochs = 20
endblock

# -----------------------------------------------------------------------------
# 3. Segmentation, when the truth carries polygons or masks.
block detector_trainer:adaptive:trainer_3
  required_masks = true
  required_min_count_per_class = 50
  prefers_masks = true
  annotation_count_preference = medium
endblock

detector_trainer:adaptive:trainer_3:trainer:type = ocv_windowed

block detector_trainer:adaptive:trainer_3:trainer:ocv_windowed
  include common_train_rf_detr.conf
  train_directory = deep_training/rf_detr_seg
  mode = disabled
  chip_width = 1728
  chip_height = 960
  min_train_box_length = 1
  image_reader:type = vxl
  trainer:rf_detr:model_size = large
  trainer:rf_detr:segmentation = True
  trainer:rf_detr:resolution = 960x1728
  trainer:rf_detr:multi_scale = false
  trainer:rf_detr:max_epochs = 20
endblock

# -----------------------------------------------------------------------------
# 4. Boxes on high-resolution imagery, gated on the measured source width.
block detector_trainer:adaptive:trainer_4
  required_min_image_width = 1600
  required_min_count_per_class = 50
  annotation_count_preference = high
  scale_preference = multi-scale
endblock

detector_trainer:adaptive:trainer_4:trainer:type = ocv_windowed

block detector_trainer:adaptive:trainer_4:trainer:ocv_windowed
  include common_train_rf_detr.conf
  train_directory = deep_training/rf_detr_1728
  mode = disabled
  chip_width = 1728
  chip_height = 960
  min_train_box_length = 1
  image_reader:type = vxl
  trainer:rf_detr:model_size = large
  trainer:rf_detr:resolution = 960x1728
  trainer:rf_detr:multi_scale = false
  trainer:rf_detr:max_epochs = 20
endblock

# -----------------------------------------------------------------------------
# 5. Boxes on smaller imagery. Ungated so every dataset has a trainable branch.
block detector_trainer:adaptive:trainer_5
  annotation_count_preference = medium
  object_size_preference = medium
endblock

detector_trainer:adaptive:trainer_5:trainer:type = ocv_windowed

block detector_trainer:adaptive:trainer_5:trainer:ocv_windowed
  include common_train_rf_detr.conf
  train_directory = deep_training/rf_detr_704
  mode = adaptive
  # 704, not 720: the deployed medium model needs a multiple of 32.
  chip_width = 704
  chip_height = 704
  min_train_box_length = 5
  image_reader:type = vxl
  trainer:rf_detr:model_size = medium
  trainer:rf_detr:resolution = 704
  trainer:rf_detr:max_epochs = 30
endblock

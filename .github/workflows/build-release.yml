name: Build and Release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: Build Linux Release
    runs-on: ubuntu-latest
    timeout-minutes: 480

    # This was three jobs -- "Stage 1 (fletch)", "Stage 2 (pytorch)" and
    # "Stage 3 (kwiver + viame)" -- each building one part of the superbuild,
    # committing its container to a cache and handing it to the next, because
    # fletch alone did not fit in a runner's time limit. Stage 1 was budgeted
    # eight hours.
    #
    # There is no fletch, no kwiver build and no pytorch build: one configure
    # builds VIAME, and `build_server_rocky.sh` is the script that already
    # did the whole thing in one go for builds that were not on a runner.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/julia*
          sudo rm -rf /opt/microsoft
          sudo rm -rf /opt/az
          sudo docker image prune --all --force
          df -h

      - name: Set up Docker
        run: |
          docker --version
          docker info

      - name: Build in a Rocky Linux container
        run: |
          docker run -td --name viame_build \
            nvidia/cuda:12.6.3-cudnn-devel-rockylinux8 bash

          docker exec viame_build mkdir -p /viame
          docker cp . viame_build:/viame/

          docker exec viame_build chmod +x /viame/cmake/build_server_rocky.sh
          docker exec viame_build /viame/cmake/build_server_rocky.sh

      - name: Verify the build produced an install and a tarball
        run: |
          if ! docker exec viame_build test -d /viame/build/install; then
            echo "ERROR: no install directory"
            docker exec viame_build ls -la /viame/build/ 2>/dev/null || true
            exit 1
          fi

          if docker exec viame_build find /viame/build \
               -name "VIAME-*-Linux-64Bit.tar.gz" | grep -q .; then
            echo "SUCCESS: Linux tarball found"
            docker exec viame_build find /viame/build \
              -name "VIAME-*-Linux-64Bit.tar.gz"
          else
            echo "ERROR: Linux tarball not found"
            exit 1
          fi

      - name: Extract build artifacts
        run: |
          mkdir -p artifacts
          docker exec viame_build find /viame/build \
            -name "VIAME-*-Linux-64Bit.tar.gz" -exec cat {} \; \
            > artifacts/viame-linux.tar.gz 2>/dev/null || true
          docker cp viame_build:/viame/build/build_log.txt \
            artifacts/build_log_linux.txt 2>/dev/null || true
          ls -la artifacts/

      - name: Get version from release notes
        id: version
        run: |
          VERSION=$(head -n 1 RELEASE_NOTES.md | awk '{print $1}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Rename artifact with version
        run: |
          cd artifacts
          if [ -f viame-linux.tar.gz ]; then
            mv viame-linux.tar.gz \
              VIAME-${{ steps.version.outputs.version }}-Linux-64Bit.tar.gz
          fi
          ls -la

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: viame-linux-release
          path: artifacts/VIAME-*-Linux-64Bit.tar.gz
          retention-days: 7

      - name: Cleanup
        if: always()
        run: |
          docker stop viame_build || true
          docker rm --force viame_build || true


  build-windows:
    name: Build Windows Release
    runs-on: windows-2025  # VS 2026
    timeout-minutes: 720  # 12 hours

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false  # We handle submodules in the build script

      - name: Enable long paths on Windows
        run: git config --system core.longpaths true

      - name: Free disk space
        shell: powershell
        run: |
          Write-Host "Disk space before cleanup:"
          Get-PSDrive -PSProvider FileSystem | Select-Object Name, @{N='Used(GB)';E={[math]::Round($_.Used/1GB,2)}}, @{N='Free(GB)';E={[math]::Round($_.Free/1GB,2)}}

          # Remove unused components to free disk space
          Write-Host "Removing unnecessary files..."

          # Remove Android SDK
          if (Test-Path "C:\Android") {
            Remove-Item -Path "C:\Android" -Recurse -Force -ErrorAction SilentlyContinue
            Write-Host "Removed Android SDK"
          }

          # Remove Haskell/ghcup
          if (Test-Path "C:\ghcup") {
            Remove-Item -Path "C:\ghcup" -Recurse -Force -ErrorAction SilentlyContinue
            Write-Host "Removed ghcup"
          }

          # Remove .NET SDK older versions (keep latest)
          $dotnetPath = "C:\Program Files\dotnet\sdk"
          if (Test-Path $dotnetPath) {
            Get-ChildItem $dotnetPath -Directory | Sort-Object Name | Select-Object -SkipLast 1 | ForEach-Object {
              Remove-Item $_.FullName -Recurse -Force -ErrorAction SilentlyContinue
              Write-Host "Removed .NET SDK: $($_.Name)"
            }
          }

          # Remove unnecessary hostedtoolcache entries
          $toolcache = "C:\hostedtoolcache\windows"
          if (Test-Path $toolcache) {
            # Remove Python versions we don't need
            Get-ChildItem "$toolcache\Python" -Directory -ErrorAction SilentlyContinue | ForEach-Object {
              Remove-Item $_.FullName -Recurse -Force -ErrorAction SilentlyContinue
              Write-Host "Removed Python: $($_.Name)"
            }
            # Remove Ruby
            if (Test-Path "$toolcache\Ruby") {
              Remove-Item "$toolcache\Ruby" -Recurse -Force -ErrorAction SilentlyContinue
              Write-Host "Removed Ruby"
            }
            # Remove Go
            if (Test-Path "$toolcache\go") {
              Remove-Item "$toolcache\go" -Recurse -Force -ErrorAction SilentlyContinue
              Write-Host "Removed Go"
            }
            # Remove Java
            if (Test-Path "$toolcache\Java*") {
              Get-ChildItem "$toolcache\Java*" -Directory -ErrorAction SilentlyContinue | ForEach-Object {
                Remove-Item $_.FullName -Recurse -Force -ErrorAction SilentlyContinue
                Write-Host "Removed Java: $($_.Name)"
              }
            }
            # Remove CodeQL
            if (Test-Path "$toolcache\CodeQL") {
              Remove-Item "$toolcache\CodeQL" -Recurse -Force -ErrorAction SilentlyContinue
              Write-Host "Removed CodeQL"
            }
          }

          # Remove Strawberry Perl
          if (Test-Path "C:\Strawberry") {
            Remove-Item -Path "C:\Strawberry" -Recurse -Force -ErrorAction SilentlyContinue
            Write-Host "Removed Strawberry Perl"
          }

          # Remove MySQL
          if (Test-Path "C:\Program Files\MySQL") {
            Remove-Item -Path "C:\Program Files\MySQL" -Recurse -Force -ErrorAction SilentlyContinue
            Write-Host "Removed MySQL"
          }

          # Remove PostgreSQL
          if (Test-Path "C:\Program Files\PostgreSQL") {
            Remove-Item -Path "C:\Program Files\PostgreSQL" -Recurse -Force -ErrorAction SilentlyContinue
            Write-Host "Removed PostgreSQL"
          }

          # Remove MongoDB
          if (Test-Path "C:\Program Files\MongoDB") {
            Remove-Item -Path "C:\Program Files\MongoDB" -Recurse -Force -ErrorAction SilentlyContinue
            Write-Host "Removed MongoDB"
          }

          # Remove LLVM/Clang
          if (Test-Path "C:\Program Files\LLVM") {
            Remove-Item -Path "C:\Program Files\LLVM" -Recurse -Force -ErrorAction SilentlyContinue
            Write-Host "Removed LLVM"
          }

          # Remove unused browser drivers
          if (Test-Path "C:\SeleniumWebDrivers") {
            Remove-Item -Path "C:\SeleniumWebDrivers" -Recurse -Force -ErrorAction SilentlyContinue
            Write-Host "Removed Selenium WebDrivers"
          }

          # Remove Microsoft SQL Server
          Get-ChildItem "C:\Program Files\Microsoft SQL Server" -Directory -ErrorAction SilentlyContinue | ForEach-Object {
            Remove-Item $_.FullName -Recurse -Force -ErrorAction SilentlyContinue
            Write-Host "Removed SQL Server: $($_.Name)"
          }

          # Clear temp folders
          Remove-Item -Path "$env:TEMP\*" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\Windows\Temp\*" -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host "Cleared temp folders"

          # Clear NuGet cache
          if (Test-Path "$env:LOCALAPPDATA\NuGet\Cache") {
            Remove-Item -Path "$env:LOCALAPPDATA\NuGet\Cache\*" -Recurse -Force -ErrorAction SilentlyContinue
            Write-Host "Cleared NuGet cache"
          }

          # Clear Chocolatey cache
          if (Test-Path "C:\ProgramData\chocolatey\cache") {
            Remove-Item -Path "C:\ProgramData\chocolatey\cache\*" -Recurse -Force -ErrorAction SilentlyContinue
            Write-Host "Cleared Chocolatey cache"
          }

          Write-Host ""
          Write-Host "Disk space after cleanup:"
          Get-PSDrive -PSProvider FileSystem | Select-Object Name, @{N='Used(GB)';E={[math]::Round($_.Used/1GB,2)}}, @{N='Free(GB)';E={[math]::Round($_.Free/1GB,2)}}

      - name: Set up CUDA
        uses: Jimver/cuda-toolkit@v0.2.21
        id: cuda-toolkit
        with:
          cuda: '12.8.0'
          method: 'network'

      - name: Download and install cuDNN
        shell: powershell
        run: |
          $CUDA_ROOT = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.8"
          $cudnnArchive = "C:\temp\cudnn.zip"
          $cudnnUrl = "https://data.kitware.com/api/v1/file/694b27c937f3e31fb199e235/download"
          $expectedMD5 = "b448b131951f661e470e649c96a93ca1"
          $maxRetries = 10
          $retryWaitSeconds = 120  # 2 minutes between retries
          $maxTotalMinutes = 60    # Stop after 1 hour total

          # Create temp directory
          New-Item -ItemType Directory -Force -Path "C:\temp"

          # Download cuDNN with retry logic and MD5 verification
          $downloadSuccess = $false
          $startTime = Get-Date
          for ($attempt = 1; $attempt -le $maxRetries; $attempt++) {
            # Check if we've exceeded the total time limit
            $elapsed = (Get-Date) - $startTime
            if ($elapsed.TotalMinutes -ge $maxTotalMinutes) {
              Write-Host "Exceeded maximum total time of $maxTotalMinutes minutes"
              break
            }

            $remainingMinutes = [math]::Round($maxTotalMinutes - $elapsed.TotalMinutes, 1)
            Write-Host "Downloading cuDNN (attempt $attempt of $maxRetries, $remainingMinutes minutes remaining)..."
            try {
              if (Test-Path $cudnnArchive) { Remove-Item $cudnnArchive -Force }

              # Use WebClient for more reliable large file downloads with progress
              $webClient = New-Object System.Net.WebClient
              $webClient.DownloadFile($cudnnUrl, $cudnnArchive)

              # Check file size
              $fileInfo = Get-Item $cudnnArchive
              Write-Host "Downloaded file size: $($fileInfo.Length) bytes"

              # Verify MD5 hash
              $actualMD5 = (Get-FileHash -Path $cudnnArchive -Algorithm MD5).Hash.ToLower()
              Write-Host "Expected MD5: $expectedMD5"
              Write-Host "Actual MD5:   $actualMD5"

              if ($actualMD5 -eq $expectedMD5) {
                Write-Host "MD5 hash verification passed"
                $downloadSuccess = $true
                break
              } else {
                Write-Host "MD5 hash mismatch (likely incomplete download), will retry..."
              }
            } catch {
              Write-Host "Download failed: $_"
            }

            if ($attempt -lt $maxRetries) {
              Write-Host "Waiting $retryWaitSeconds seconds (2 minutes) before retry..."
              Start-Sleep -Seconds $retryWaitSeconds
            }
          }

          if (-not $downloadSuccess) {
            Write-Error "Failed to download cuDNN after $maxRetries attempts over $([math]::Round($elapsed.TotalMinutes, 1)) minutes"
            exit 1
          }

          # Extract using Expand-Archive (native PowerShell for zip files)
          Write-Host "Extracting cuDNN archive..."
          New-Item -ItemType Directory -Force -Path "C:\temp\cudnn_temp"
          Expand-Archive -Path $cudnnArchive -DestinationPath "C:\temp\cudnn_temp" -Force

          # List what was extracted
          Write-Host "Extracted contents:"
          Get-ChildItem -Path "C:\temp\cudnn_temp" -Recurse -Depth 2 | ForEach-Object { Write-Host $_.FullName }

          # Find the extracted directory (cudnn-windows-x86_64-*-archive)
          $cudnnDir = Get-ChildItem -Path "C:\temp\cudnn_temp" -Directory | Where-Object { $_.Name -match "cudnn" } | Select-Object -First 1
          if (-not $cudnnDir) {
            $cudnnDir = Get-ChildItem -Path "C:\temp\cudnn_temp" -Directory | Select-Object -First 1
          }

          if (-not $cudnnDir) {
            Write-Error "Failed to find cuDNN directory after extraction"
            exit 1
          }

          Write-Host "Found cuDNN directory: $($cudnnDir.FullName)"
          Get-ChildItem -Path $cudnnDir.FullName

          # Verify expected directories exist
          if (-not (Test-Path "$($cudnnDir.FullName)\include")) {
            Write-Error "cuDNN include directory not found - extraction may have failed"
            exit 1
          }

          # Copy cuDNN files directly into CUDA tree
          Write-Host "Installing cuDNN into CUDA directory..."
          Copy-Item -Path "$($cudnnDir.FullName)\bin\*" -Destination "$CUDA_ROOT\bin" -Force
          Copy-Item -Path "$($cudnnDir.FullName)\include\*" -Destination "$CUDA_ROOT\include" -Force
          Copy-Item -Path "$($cudnnDir.FullName)\lib\x64\*" -Destination "$CUDA_ROOT\lib\x64" -Force

          # Verify installation
          Write-Host "cuDNN files installed:"
          Get-ChildItem "$CUDA_ROOT\bin\cudnn*.dll" | ForEach-Object { Write-Host $_.Name }

          # Cleanup
          Remove-Item -Path $cudnnArchive -Force
          Remove-Item -Path "C:\temp\cudnn_temp" -Recurse -Force

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        shell: powershell
        run: |
          # Install zlib
          choco install zlib -y

          # Create ZLib directory structure expected by build script
          New-Item -ItemType Directory -Force -Path "C:\Program Files\ZLib\dll_x64"

          # Copy zlib DLL to expected location (choco installs to different path)
          $zlibPath = "C:\ProgramData\chocolatey\lib\zlib\tools"
          if (Test-Path "$zlibPath\zlibwapi.dll") {
            Copy-Item -Path "$zlibPath\zlibwapi.dll" -Destination "C:\Program Files\ZLib\dll_x64\" -Force
          } elseif (Test-Path "C:\Windows\System32\zlibwapi.dll") {
            Copy-Item -Path "C:\Windows\System32\zlibwapi.dll" -Destination "C:\Program Files\ZLib\dll_x64\" -Force
          } else {
            # Download zlib DLL directly if not found
            Write-Host "Downloading zlibwapi.dll..."
            Invoke-WebRequest -Uri "https://www.winimage.com/zLibDll/zlib123dllx64.zip" -OutFile "C:\temp\zlib.zip"
            Expand-Archive -Path "C:\temp\zlib.zip" -DestinationPath "C:\temp\zlib_temp" -Force
            Copy-Item -Path "C:\temp\zlib_temp\dll_x64\zlibwapi.dll" -Destination "C:\Program Files\ZLib\dll_x64\" -Force
            Remove-Item -Path "C:\temp\zlib.zip" -Force
            Remove-Item -Path "C:\temp\zlib_temp" -Recurse -Force
          }

          # Install CMake
          choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y

          # Install Git
          choco install git -y

          # Copy Node.js 20 (from setup-node) to the location expected by the build script
          # The build script replaces PATH, so we need Node.js at C:\Program Files\nodejs
          $setupNodePath = (Get-Command node).Source | Split-Path -Parent
          Write-Host "setup-node installed Node.js at: $setupNodePath"
          Write-Host "Node.js version: $(node --version)"

          # Remove any existing nodejs directory and copy the setup-node installation
          if (Test-Path "C:\Program Files\nodejs") {
            Remove-Item -Path "C:\Program Files\nodejs" -Recurse -Force
          }
          Copy-Item -Path $setupNodePath -Destination "C:\Program Files\nodejs" -Recurse -Force

          # Install yarn globally
          npm install -g yarn

          # Refresh PATH so yarn is available
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")

          # Verify installations and show locations
          Write-Host "Node.js location:"
          Get-Command node -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source
          Write-Host "Node.js version at target location:"
          & "C:\Program Files\nodejs\node.exe" --version
          Write-Host "Yarn location:"
          Get-Command yarn -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source

      - name: Install Visual Studio 2026 Build Tools
        shell: powershell
        run: |
          Write-Host "Installing VS 2026 Build Tools..."
          choco install visualstudio2026buildtools `
            --package-parameters "--add Microsoft.VisualStudio.Workload.VCTools --add Microsoft.VisualStudio.Component.VC.Tools.x86.x64 --includeRecommended --quiet" `
            -y --ignore-package-exit-codes=3010
          Write-Host "VS 2026 Build Tools installation completed"

      - name: Configure build paths
        shell: powershell
        run: |
          # Create required directories
          New-Item -ItemType Directory -Force -Path "C:\VIAME-Builds\GPU"

          # Copy source to expected location
          Copy-Item -Path ".\*" -Destination "C:\VIAME-Builds\GPU" -Recurse -Force

      - name: Apply GitHub release build settings
        shell: powershell
        run: |
          # Add GitHub-specific cmake preset to the Windows build configuration
          $cmakeFile = "C:\VIAME-Builds\GPU\cmake\build_server_windows.cmake"
          $content = Get-Content $cmakeFile -Raw

          # Insert the github preset include after the desktop preset include
          $content = $content -replace '(include_cmake_preset\(build_cmake_desktop\.cmake\))', "`$1`ninclude_cmake_preset(build_cmake_github.cmake)"

          Set-Content -Path $cmakeFile -Value $content
          Write-Host "Added build_cmake_github.cmake preset to Windows build configuration"

      - name: Run Windows build
        shell: cmd
        working-directory: C:\VIAME-Builds\GPU
        run: |
          call cmake\build_server_windows.bat

      - name: Verify Windows build completed successfully
        shell: powershell
        run: |
          Write-Host "Checking if build completed successfully..."

          $installPath = "C:\VIAME-Builds\GPU\build\install"
          $viamePath = "C:\VIAME-Builds\GPU\build\VIAME"
          $setupScript = "setup_viame.bat"

          # Check that setup_viame.bat exists in the install directory
          # The build script renames install to VIAME for packaging, so check both locations
          if (Test-Path "$installPath\$setupScript") {
            Write-Host "SUCCESS: $setupScript found in $installPath"
          } elseif (Test-Path "$viamePath\$setupScript") {
            Write-Host "SUCCESS: $setupScript found in $viamePath"
          } else {
            Write-Host "ERROR: $setupScript not found in install directory"
            Write-Host "Listing C:\VIAME-Builds\GPU\build\ contents:"
            Get-ChildItem -Path "C:\VIAME-Builds\GPU\build\" -ErrorAction SilentlyContinue | Format-Table Name, Length, LastWriteTime
            Write-Host "Listing $installPath contents (if exists):"
            Get-ChildItem -Path $installPath -ErrorAction SilentlyContinue | Format-Table Name, Length, LastWriteTime
            exit 1
          }

          # Check that the zip file was created
          $zipFiles = Get-ChildItem -Path "C:\VIAME-Builds\GPU\build\" -Filter "VIAME-*-Windows-64Bit.zip" -ErrorAction SilentlyContinue
          if ($zipFiles) {
            Write-Host "SUCCESS: Windows zip file found:"
            $zipFiles | ForEach-Object { Write-Host $_.FullName }
          } else {
            Write-Host "ERROR: Windows zip file not found"
            exit 1
          }

          Write-Host "Windows build verification passed!"

      - name: Get version from release notes
        id: version
        shell: bash
        run: |
          VERSION=$(head -n 1 RELEASE_NOTES.md | awk '{print $1}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: viame-windows-release
          path: C:\VIAME-Builds\GPU\build\VIAME-*-Windows-64Bit.zip
          retention-days: 7

  create-release:
    name: Create GitHub Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version from release notes
        id: version
        run: |
          VERSION=$(head -n 1 RELEASE_NOTES.md | awk '{print $1}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: viame-linux-release
          path: ./release-artifacts

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: viame-windows-release
          path: ./release-artifacts

      - name: List artifacts
        run: ls -la ./release-artifacts

      - name: Delete existing 'current' release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Delete the existing 'current' release if it exists
          gh release delete current --yes || true
          # Also delete the tag
          git push origin :refs/tags/current || true

      - name: Create 'current' release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create current \
            --title "Current Build (${{ steps.version.outputs.version }})" \
            --notes "Automated build from main branch.

          Version: ${{ steps.version.outputs.version }}
          Commit: ${{ github.sha }}
          Built: $(date -u +"%Y-%m-%d %H:%M:%S UTC")

          This release is automatically updated whenever the main branch is updated." \
            --prerelease \
            ./release-artifacts/*

# =============================================================================
# Title: Train Detector - RF DETR Large Seg 1728x960 Motion (Optical Flow), round 2
#
# Resumes train_detector_rf_detr_l_seg_1728_mot_opt.conf at epoch 40 for 30 more.
# See that file for everything not overridden here.
# =============================================================================

include common_train_detector.conf

relativepath pipeline_template = templates/embedded_rf_detr_optical_flow.pipe

default_percent_validation = 0.10
validation_burst_frame_count = 500
downsample = 10

relativepath augmentation_pipeline = train_aug_add_optical_flow.pipe

augmentation_cache = augmented_images

# Wipe augmented_images first if another motion config built it -- all three
# share the directory name with different channel layouts.
regenerate_cache = false

augmentation_threads = 32


detector_trainer:type = ocv_windowed

block detector_trainer:ocv_windowed

  train_directory = deep_training

  mode = disabled

  chip_width = 1728
  chip_width_step = 1152

  chip_height = 960
  chip_height_step = 640

  chip_adaptive_thresh = 1600000

  min_train_box_length = 1

  image_reader:type = vxl

endblock

block detector_trainer:ocv_windowed:trainer

  type = rf_detr

  rf_detr:model_size = large
  rf_detr:segmentation = True
  rf_detr:device = auto
  rf_detr:num_channels = 4
  rf_detr:resolution = 960x1728
  rf_detr:multi_scale = false
  rf_detr:augmentation = motion_rgb

  # Must be a .ckpt: the best_*.pth files carry weights but no optimizer state.
  rf_detr:resume = true
  rf_detr:seed_model = /data/users/matt.dawkins/Runs/Training-FishTrack-OPT-SEG/seed_models/last_epoch40.ckpt

  # Must hold the same global batch the seed was trained at -- adaptive keeps
  # micro x accum x GPUs on the target below whatever hardware this resumes on.
  rf_detr:batch_size = adaptive
  rf_detr:auto_batch_target_effective = 16

  # Absolute across the resume, not additional -- 40 already run, so this is 30 more.
  rf_detr:max_epochs = 70

  rf_detr:learning_rate = 7.0e-6
  rf_detr:learning_rate_encoder = 1.05e-5
  rf_detr:lr_vit_layer_decay = 0.9
  rf_detr:lr_component_decay = 0.85
  rf_detr:lr_stem = 7.0e-6

  rf_detr:warmup_epochs = 0.5

  # Not cosine: its horizon comes from max_epochs but the resume restarts the
  # schedule counter, so it would run only the first 30/70 of its arc.
  rf_detr:lr_scheduler = step
  rf_detr:lr_drop = 20

  rf_detr:use_ema = True
  rf_detr:ema_decay = 0.9998

  rf_detr:checkpoint_interval = 5

  # Without this the inherited EMA wins best-checkpoint selection and the run
  # exports its own input.
  rf_detr:skip_best_epochs = 2

  rf_detr:num_workers = 8
  rf_detr:pin_memory = True
  rf_detr:persistent_workers = False
  rf_detr:prefetch_factor = 3

  rf_detr:val_subsample = 4000
  rf_detr:eval_max_dets = 300

  rf_detr:ddp_timeout = 3600
  rf_detr:timeout = 1209600

endblock

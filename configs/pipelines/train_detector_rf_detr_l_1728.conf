# =============================================================================
# Title: Train Detector - RF DETR Large 1728x960 RGB (boxes)
#
# Description: Box-only twin of train_detector_rf_detr_l_seg_1728.conf --
# same resolution, batch and LRs, RFDETRLarge instead of RFDETRSegLarge, and
# input polygons ignored. Uses the seg run's tuning rather than the _mot_mim
# recipe's, so the two RGB runs differ only in the mask head.
# =============================================================================

include common_train_detector.conf

#  Pipeline template file. Plain RGB deploy template (no motion/flow infusion).
relativepath pipeline_template = templates/embedded_default.pipe

#  Override default validation percentage
default_percent_validation = 0.10

#  Matched to the seg and motion runs so the split lands on the same frames.
validation_burst_frame_count = 500

#  Every 3rd extracted frame -- denser than the seg run's 8, for more steps.
downsample = 3

#  Augmentatation cache. Byte-identical to the seg RGB config's, so shareable.
augmentation_cache = augmented_images

#  Reuse cached frames -- WIPE augmented_images first if another config built it.
regenerate_cache = false

#  Algorithm to use for 'detector_trainer'.
detector_trainer:type = ocv_windowed

block detector_trainer:ocv_windowed

  # Directory for all files used in training
  train_directory = deep_training

  # Windowing mode, can be disabled, maintain_ar, scale, chip, adaptive
  mode = disabled

  # Unused while mode = disabled; RF-DETR does the resize. Kept aligned anyway.
  chip_width = 1728
  chip_width_step = 1152

  chip_height = 960
  chip_height_step = 640

  # Adaptive size threshold for chipping
  chip_adaptive_thresh = 1600000

  # Keep small boxes -- small fish are the target.
  min_train_box_length = 1
  #small_box_area = 200
  #small_action = remove

  # Image reader type
  image_reader:type = vxl

endblock

block detector_trainer:ocv_windowed:trainer

  # Trainer type
  type = rf_detr

  # The model variant (base, large, small, medium, nano)
  rf_detr:model_size = large

  # Box-only RFDETRLarge; input polygons are ignored.
  rf_detr:segmentation = False

  # Device to train on (auto, cpu, cuda, cuda:N)
  rf_detr:device = auto

  # HEIGHTxWIDTH, both divisible by the large model's 32; near-16:9 so the
  # source aspect ratio is preserved rather than squashed square.
  rf_detr:resolution = 960x1728

  # Off: it resizes every image to the top of the jitter ladder on CPU and
  # re-interpolates down on GPU, 1.36x the pixel cost for the same average.
  rf_detr:multi_scale = false

  # "default" has no vertical flip, which is what this up-is-up footage needs.
  # Do NOT use "aggressive"/"aerial": both manufacture upside-down fish.
  rf_detr:augmentation = default

  # Empty fine-tunes from COCO. Seg checkpoints are patch 12 and cannot seed
  # this patch-16 model.
  rf_detr:seed_model =

  # The LR sees batch_size * grad_accum_steps * num_gpus; adaptive sizes the
  # micro-batch to VRAM and accumulates to hold that product at the target.
  # 16 matches the seg RGB run so the seg/box comparison shares its tuning.
  rf_detr:batch_size = adaptive
  rf_detr:auto_batch_target_effective = 16

  # Matched to the seg and motion configs. Short for a fast first pass.
  rf_detr:max_epochs = 20

  # RF-DETR's base LRs, tuned for the global batch of 16 above, so unscaled.
  # The mot_mim recipe scales by sqrt(2) for its batch of 32 -- sqrt not
  # linear, since DETR training is unstable at high LR.
  rf_detr:learning_rate = 1e-4
  rf_detr:learning_rate_encoder = 1.5e-4

  # The head is re-initialized to one class, so ramp the first steps in.
  rf_detr:warmup_epochs = 0.25

  # Cosine anneals to 0 across max_epochs; "step" drops at 100 and never fires.
  rf_detr:lr_scheduler = cosine

  # Applied per optimizer step, so the horizon is ~1/(1-decay) steps.
  rf_detr:use_ema = True
  rf_detr:ema_decay = 0.9998

  # Checkpointing
  rf_detr:checkpoint_interval = 5

  # Scales as ranks * num_workers * prefetch_factor * batch_size; 8 per rank
  # OOMed a 125 GB node.
  rf_detr:num_workers = 4
  rf_detr:pin_memory = True
  rf_detr:persistent_workers = False
  rf_detr:prefetch_factor = 2

  # Full validation OOMed the host; run a full eval on the final best
  # checkpoint for the headline number.
  rf_detr:val_subsample = 4000
  rf_detr:eval_max_dets = 300

  # Seconds a rank may lag before the NCCL watchdog SIGABRTs every rank. The
  # 30-minute default is short enough that one slow rank kills a multi-day run.
  # The ranks reporting the timeout are victims; the culprit is the one missing.
  rf_detr:ddp_timeout = 3600

  # Max timeout in seconds (default = 1209600, or two weeks)
  rf_detr:timeout = 1209600

endblock

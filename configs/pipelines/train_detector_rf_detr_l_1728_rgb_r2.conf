# =============================================================================
# Title: Train Detector - RF DETR Large 1728x960 RGB (boxes), round 2
#
# Resumes train_detector_rf_detr_l_1728_rgb.conf at epoch 20 for 8 more, on the
# full extracted-frame set instead of every 3rd. See that file for everything
# not overridden here.
# =============================================================================

include common_train_detector.conf

relativepath pipeline_template = templates/embedded_default.pipe

# Must match round 1 exactly: the burst split assigns frames by index, so any
# change here moves validation onto frames the seed already trained on.
default_percent_validation = 0.10
validation_burst_frame_count = 500

# Disabled, against round 1's every-3rd. Triples the distinct frames per epoch
# (~137k -> ~410k) and so the optimizer steps per epoch. Validation is left
# whole either way, so the metric stays comparable.
downsample = 0

augmentation_cache = augmented_images

# Round 1 already extracted every frame -- downsample is applied to the listing,
# not the cache -- so point this run at that directory and nothing re-extracts.
regenerate_cache = false

detector_trainer:type = ocv_windowed

block detector_trainer:ocv_windowed

  train_directory = deep_training

  mode = disabled

  chip_width = 1728
  chip_width_step = 1152

  chip_height = 960
  chip_height_step = 640

  chip_adaptive_thresh = 1600000

  min_train_box_length = 1

  image_reader:type = vxl

endblock

block detector_trainer:ocv_windowed:trainer

  type = rf_detr

  rf_detr:model_size = large
  rf_detr:segmentation = False
  rf_detr:device = auto
  rf_detr:resolution = 960x1728
  rf_detr:multi_scale = false
  rf_detr:augmentation = default

  # Must be a .ckpt: the best_*.pth files carry weights but no optimizer or EMA
  # state. Must also live OUTSIDE train_directory, which the windowed trainer
  # deletes outright at startup whenever reuse_cache is off -- pointed inside,
  # this run would erase the checkpoint it is resuming from.
  rf_detr:resume = true
  rf_detr:seed_model = /data/users/matt.dawkins/Runs/Training-SEFSC-DETR-Groups/seed_models/last_epoch20.ckpt

  # Must hold the same global batch the seed was trained at, so its LRs still mean
  # what they meant in round 1.
  rf_detr:batch_size = adaptive
  rf_detr:auto_batch_target_effective = 16

  # Absolute across the resume, not additional -- 20 already run, so this is 8
  # more. Above 20 the total is just this number; at or below it the resume
  # rounds up to the next multiple instead.
  rf_detr:max_epochs = 28

  # A third of round 1's 1e-4/1.5e-4. The seed is converged and its cosine
  # annealed to ~0, so restarting at the full rate would undo most of it, but
  # there are three times as many distinct frames to move on.
  rf_detr:learning_rate = 3.0e-5
  rf_detr:learning_rate_encoder = 4.5e-5

  # Compressed by max_epochs/(max_epochs - completed) = 3.5 along with the rest
  # of the schedule, so this is ~3.7k real steps, not 0.5 epochs of them.
  rf_detr:warmup_epochs = 0.5

  # Cosine is safe on a resume now: rfdetr_resume_lr_callback rescales the
  # restarted counter into the remaining epochs, so the arc finishes at epoch 27
  # instead of stopping partway. The older _r2 configs use step because they
  # predate that.
  rf_detr:lr_scheduler = cosine

  rf_detr:use_ema = True
  rf_detr:ema_decay = 0.9998

  rf_detr:checkpoint_interval = 5

  # Without this the inherited EMA wins best-checkpoint selection and the run
  # exports its own input.
  rf_detr:skip_best_epochs = 2

  rf_detr:num_workers = 4
  rf_detr:pin_memory = True
  rf_detr:persistent_workers = False
  rf_detr:prefetch_factor = 2

  # Same subsample as round 1, and it is deterministic, so the two runs' numbers
  # are measured on identical frames.
  rf_detr:val_subsample = 4000
  rf_detr:eval_max_dets = 300

  rf_detr:ddp_timeout = 3600
  rf_detr:timeout = 1209600

endblock

# =============================================================================
# Title: Train Detector - RF DETR Large 1728x960 Motion (MIM), continuation
#
# Description: Continues the mot_mim line for another 30 epochs, picking up at
# epoch 40. Identical data, channels and architecture to
# train_detector_rf_detr_l_1728_mot_mim.conf -- only the resume, the epoch
# budget and the learning-rate schedule differ. Read that file for the rest of
# the reasoning; only the deltas are commented here.
#
# History, all mAP 50:95 on the 4000-image validation subsample:
#
#   epochs  0-19   0.4393 -> 0.5697   warm start from fish_with_motion_rf_detr,
#                                     cosine 1.5e-4 -> 0
#   epochs 20-32   0.5697 -> 0.5188   1.0e-4 flat; 13 epochs inside a +/-0.007
#                                     band with no trend. A dead loss.
#   epochs 33-39   0.5188 -> 0.5585   1.0e-5 after lr_drop; +0.040, still
#                                     gaining ~0.001/epoch at the end.
#
# So the LR, not the epoch count, was what bound the previous two rounds: every
# gain in the 20-39 block came from the 1.0e-5 tail, and the 1.0e-4 block ahead
# of it destroyed 0.05 mAP that the tail then spent seven epochs buying back.
# This run therefore drops the high-LR phase entirely and spends all 30 epochs
# in the regime that was actually productive.
#
# Do not read the first Val table in the log as a score for these weights. It
# is Lightning's sanity-check pass over num_sanity_val_steps = 2 batches (~18 GT
# objects), so it is noisy and biased high -- it read 0.5872 for the weights
# that scored 0.5697 on the full subsample. The seed's own number on the full
# subsample has never been measured; 0.6613 is that same 2-batch pass, and the
# 0.6324 in round 1's log is the epoch-0 EMA, a ~63/37 blend of seed and
# epoch-0 weights rather than the seed itself.
#
# This is a RESUME, not another warm start. Round 1 lost ~0.22 mAP in epoch 0
# re-warming from a converged checkpoint through seed_model, because that path
# keeps only the weights: the Adam moments and the EMA are rebuilt from
# nothing. rf_detr:resume hands the .ckpt to trainer.fit(ckpt_path=) instead,
# so all of that survives and there is no crater at the handover.
# =============================================================================

include common_train_detector.conf

relativepath pipeline_template = templates/embedded_rf_detr_motion.pipe

default_percent_validation = 0.10
validation_burst_frame_count = 500
downsample = 8

relativepath augmentation_pipeline = train_aug_add_double_motion.pipe

augmentation_cache = augmented_images

#  Reuse round 1's augmented frames. They were built by this same config's
#  channel layout and round 1 verified them, so there is nothing left to prove
#  by rebuilding -- and extraction of the 504 items cost 3.5 hours of the ~14.5
#  hour job, against ~33 min/epoch of actual training.
regenerate_cache = false

augmentation_threads = 32


detector_trainer:type = ocv_windowed

block detector_trainer:ocv_windowed

  train_directory = deep_training

  mode = disabled

  chip_width = 1728
  chip_width_step = 1152

  chip_height = 960
  chip_height_step = 640

  chip_adaptive_thresh = 1600000

  min_train_box_length = 1

  image_reader:type = vxl

endblock

block detector_trainer:ocv_windowed:trainer

  type = rf_detr

  rf_detr:model_size = large
  rf_detr:segmentation = False
  rf_detr:device = auto
  rf_detr:resolution = 960x1728
  rf_detr:multi_scale = false
  rf_detr:augmentation = motion_grey

  #  Continue round 1 rather than warm-starting from its weights. seed_model
  #  doubles as the resume path (the network is built from it before
  #  fit(ckpt_path=) restores into it, so a second path could disagree on
  #  num_classes), and it must be the PyTorch-Lightning .ckpt -- the
  #  checkpoint_best_*.pth files carry weights only.
  #
  #  Absolute, and NOT relativepath: this points into the run directory, not
  #  into the install tree. Point it at a copy taken aside from round 1's
  #  output, since a resumed run rewrites last.ckpt at the end of every epoch.
  rf_detr:resume = true
  rf_detr:seed_model = /data/users/matt.dawkins/Runs/Training-FishTrack-MOT-MIM/seed_models/last_epoch40.ckpt

  rf_detr:batch_size = 8
  rf_detr:grad_accum_steps = 1

  #  ABSOLUTE, not additional. This is PyTorch-Lightning's max_epochs and
  #  trainer.current_epoch keeps counting across a resume, so 70 is what buys
  #  30 more epochs on top of the 40 already run; leaving it at 40 would
  #  satisfy the stopping condition immediately and the job would exit having
  #  trained nothing.
  rf_detr:max_epochs = 70

  #  Exactly the rates the previous run reached after its lr_drop, which is the
  #  only phase of it that gained anything: 1.0e-4 / 1.4e-4 / 5.0e-5 at 0.1x.
  #  Starting here rather than a tenth above it is the whole point of this run
  #  -- epochs 20-32 established that this model does not tolerate 1.0e-4, and
  #  epochs 33-39 that it makes steady progress at 1.0e-5. The ratios between
  #  the three groups are unchanged from the previous two rounds.
  #
  #  Expect roughly +0.015 to +0.025 over the 30 epochs, extrapolating the
  #  ~0.001/epoch the tail was still gaining and allowing for it to keep
  #  decelerating. If instead this stalls inside the first five epochs, the
  #  model is at its ceiling on this corpus and the answer is not a third
  #  schedule -- see the header note about the seed's unmeasured baseline.
  rf_detr:learning_rate = 1.0e-5
  rf_detr:learning_rate_encoder = 1.4e-5
  rf_detr:lr_stem = 5.0e-6

  rf_detr:lr_vit_layer_decay = 0.9
  rf_detr:lr_component_decay = 0.85

  #  Half an epoch, down from a full one. Warmup runs again from zero because
  #  VIAME resets the scheduler counter on a resume, but there is far less to
  #  protect against here than in the previous rounds: the restored optimizer
  #  state came off an LR of 1.0e-5 and this run starts at 1.0e-5, so there is
  #  no step change to ramp into. A full epoch of it would just be a wasted
  #  thirtieth of the budget.
  rf_detr:warmup_epochs = 0.5

  #  NOT cosine. The cosine horizon is derived from max_epochs (total_steps =
  #  trainer.estimated_stepping_batches, which multiplies by max_epochs and
  #  ignores the epochs already completed), but the resume restarts the
  #  schedule counter at zero. A cosine would therefore be laid out across 70
  #  epochs and only 30 of them run: it would stop a third of the way down its
  #  own arc, having barely annealed at all. The step schedule is measured in
  #  epochs from the restart instead, so it means what it says: 20 epochs at
  #  the rates above, then 10 at a tenth of them to settle.
  rf_detr:lr_scheduler = step
  rf_detr:lr_drop = 20

  rf_detr:use_ema = True
  rf_detr:ema_decay = 0.9998

  rf_detr:checkpoint_interval = 5

  #  Rebased onto the resume epoch by VIAME, so this ignores epochs 40-41. Two
  #  rather than the three the previous round used: there is no LR step change
  #  to dip through this time, so the only thing being covered is the half
  #  epoch of warmup. It still matters -- without it the inherited EMA, which
  #  arrives holding the best weights the line has produced, can win
  #  best-checkpoint selection outright and this run would export its own input.
  rf_detr:skip_best_epochs = 2

  rf_detr:num_workers = 4
  rf_detr:pin_memory = True
  rf_detr:persistent_workers = False
  rf_detr:prefetch_factor = 2

  rf_detr:val_subsample = 4000
  rf_detr:eval_max_dets = 300

  rf_detr:ddp_timeout = 3600
  rf_detr:timeout = 1209600

endblock

# Train SLEAP-NN to attach head/tail keypoints to existing detections.
# Input CSVs need bounding boxes and (kp) head x y / (kp) tail x y attributes.
# Missing point slots are supported; each retained crop needs at least one point.
include common_train_detector.conf

relativepath pipeline_template = templates/utility_add_keypoints_sleap.pipe

# Crop inside the Python trainer so boxes, images, and keypoints share one affine.
# Do not wrap this trainer in ocv_windowed scale/chip modes.
detector_trainer:type = sleap

block detector_trainer:sleap

  identifier = viame-sleap-head-tail
  train_directory = deep_training

  keypoint_names = head,tail
  crop_width = 256
  crop_height = 256
  crop_padding = 1.25

  device = auto
  batch_size = 16
  max_epochs = 100
  learning_rate = 0.001
  num_workers = 4
  patience = 15
  augmentation = true
  seed = 42

  # Small U-Net; no model download is required.
  filters = 16
  max_stride = 16
  output_stride = 2
  sigma = 2.5

  # 0 uses all training crops per epoch.
  steps_per_epoch = 0
  timeout = 1209600

  # Optional trained_keypoints.pt with matching architecture and point order.
  seed_model =

endblock

# =============================================================================
# Title: Train Tracker - SAM 3.1 (Tracker Only)
#
# Description: Fine-tunes only the SAM 3.1 multiplex tracker on ground-truth
# tracks with polygon annotations, leaving the detector weights exactly as in
# the source checkpoint, so the tuned tracker is driven by another
# detector's detections. Produces a full SAM 3.1 checkpoint and a pipeline
# in which the default fish detector's detections are tracked by it
# (templates/tracker_sam3_fish_detector.pipe).
# =============================================================================

# Example usage:
#   viame train -i /path/to/training/data \
#     -c train_tracker_sam3_tracker_only.conf --tracker sam3
#
# To pair it with a detector trained in the same run instead, see
# templates/tracker_sam3_trained_detector.pipe. For SAM 3.1's own text-query
# detection, set tracker_pipeline_template = templates/tracker_sam3.pipe.

include train_tracker_sam3.conf

tracker_trainer:sam3:train_detector = false

relativepath tracker_pipeline_template = templates/tracker_sam3_fish_detector.pipe

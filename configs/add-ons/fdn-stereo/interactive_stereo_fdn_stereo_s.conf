# =============================================================================
# Title: Interactive Stereo - Foundation Stereo (Small)
#
# Description: Foundation-Stereo small model for disparity estimation.
# Requires GPU.
# =============================================================================

# ---- Stereo Algorithm -------------------------------------------------------

compute_stereo_depth_map:type = foundation_stereo

# ---- Model Parameters -------------------------------------------------------

compute_stereo_depth_map:foundation_stereo:vit_size = vits
relativepath compute_stereo_depth_map:foundation_stereo:checkpoint_path = models/foundation_stereo_s.pth
relativepath compute_stereo_depth_map:foundation_stereo:model_config_path = models/foundation_stereo_s.yaml
compute_stereo_depth_map:foundation_stereo:output_mode = disparity
compute_stereo_depth_map:foundation_stereo:use_half_precision = true

# ---- Service Settings --------------------------------------------------------

service:scale = 1.0

# ---- Dense Grid ---------------------------------------------------------------
# Same keys as compute_measurements. Frames are rectified with the rig
# calibration before disparity; alpha -1 keeps every source pixel, since a rig
# whose baseline has a vertical component is otherwise cropped to a sliver.
# Keypoints sit on the animal's silhouette where disparity blends into the
# background, so sampling favours the nearer surface and line endpoints come
# from a robust fit of disparity along the whole segment.

rectification_alpha = -1.0
refine_keypoints_disparity_window = 3
refine_keypoints_disparity_percentile = 0.9
refine_disparity_segment = true
disparity_segment_samples = 11
disparity_segment_max_outliers = 3
disparity_segment_max_error = 10.0

# =============================================================================
# Title: Train Detector - RF DETR Large Seg 720
#
# Description: The adaptive-windowing SEGMENTATION recipe (RFDETRSegLarge,
# masks + boxes, 720px). train_detector_rf_detr_l_720.conf is the box-only
# version of the same windowing recipe; this one also thins the schedule
# (downsample 8 + val_subsample) for large video corpora.
#
# TUNING NOTES
#   * Batch and thread counts all size themselves to the machine. The thread
#     counts read the machine's cores, not a cgroup, so pin them when the
#     scheduler grants a subset.
#   * Raising the GLOBAL batch means raising auto_batch_target_effective and
#     scaling the LR by ~sqrt(target/16) with it, not editing the micro-batch.
#     Validation is pinned to batch 1 for seg automatically.
#   * Resolution/chip is 720 (=24*30), the seg-large divisibility requirement.
#   * DISK: adaptive chipping of a large video set produces millions of chips.
#     Frames + chips can be hundreds of GB (PNG) or ~3x less as JPG. If disk is
#     tight, set chip_format = jpg below (frames are written PNG by the stock
#     code; JPG frame output requires a local code tweak to extract_video_frames).
# =============================================================================

include common_train_detector.conf

#  Pipeline template file.
relativepath pipeline_template = templates/embedded_default.pipe

#  Override default validation percentage
default_percent_validation = 0.10

#  Every 8th extracted frame; see the 1728 configs. Note val_subsample is left
#  at 0 here, so the full validation set is scored every epoch while train is
#  thinned 8x -- validation becomes roughly half the frames touched per epoch
#  and the speedup falls well short of 8x. Set val_subsample if that shows.
downsample = 8

#  Augmentation pipeline.
#relativepath augmentation_pipeline = train_hue_shifting_only_aug.pipe

#  Augmentatation cache.
augmentation_cache = augmented_images

#  Reuse cached frames -- WIPE augmented_images first if another config built it.
regenerate_cache = false

#  Algorithm to use for 'detector_trainer'. All windowing and trainer settings
#  live in the shared recipe files; override individual keys after the include.
detector_trainer:type = ocv_windowed

block detector_trainer:ocv_windowed
  include common_train_rf_detr_l_720_seg.conf
endblock

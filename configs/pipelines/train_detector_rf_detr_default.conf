# =============================================================================
# Title: Train Detector - RF DETR Default (auto-selects boxes vs segmentation)
#
# Description: Auto-selects between the seg and box 720 RF-DETR recipes from
# the adaptive trainer's data statistics: RFDETRSegLarge when every annotation
# carries a polygon or mask, otherwise box-only RFDETRLarge.
# =============================================================================

include common_train_detector.conf

#  Pipeline template file.
relativepath pipeline_template = templates/embedded_default.pipe

#  Override default validation percentage
default_percent_validation = 0.10

#  Augmentatation cache.
augmentation_cache = augmented_images

#  Reuse cached frames -- WIPE augmented_images first if another config built it.
regenerate_cache = false

#  Algorithm to use for 'detector_trainer'.
detector_trainer:type = adaptive

block detector_trainer:adaptive

  max_trainers_to_run = 1

  verbose = true

endblock

# ==============================================================================
#  Trainer 1: segmentation recipe, when every annotation has a polygon or mask
# ==============================================================================
block detector_trainer:adaptive:trainer_1

  required_mask_fraction = 1.0
  prefers_masks = true

  trainer:type = ocv_windowed

  block trainer:ocv_windowed

    include common_train_rf_detr.conf

    # Windowing mode, can be disabled, maintain_ar, scale, chip, adaptive
    mode = adaptive

    # Threads for chipping, leave as 0 to auto-estimate
    chip_threads = 0

    # 720 divides by 24, which seg-large requires.
    chip_width = 720
    chip_step_width = 480
    chip_height = 720
    chip_step_height = 480

    chips_w_gt_only = true

    # Keep some empty tiles per frame, or the model never sees open water.
    background_chip_ratio = 0.5

    # Don't train on chips with detections smaller than this
    min_train_box_length = 5

    # Uncomment to write JPG chips instead of PNG to save disk.
    #chip_format = jpg

    # ocv, not vxl: the vxl writer corrupts the heap over long runs.
    image_reader:type = ocv

    # The model variant (base, large, small, medium, nano)
    trainer:rf_detr:model_size = large

    # Network perspective field size
    trainer:rf_detr:chip_width = 720

    # RFDETRSegLarge. Seeds do not cross with the patch-16 box model.
    trainer:rf_detr:segmentation = True

    # Must be divisible by 24 for seg-large.
    trainer:rf_detr:resolution = 720

    # Off: the CPU-side jitter resize costs more than it buys.
    trainer:rf_detr:multi_scale = false

    trainer:rf_detr:max_epochs = 20

    # Per rank; raise toward the core count.
    trainer:rf_detr:num_workers = 8

    # Seg validates at batch 1, so bound it or it dominates the epoch.
    trainer:rf_detr:val_subsample = 4000

    # Seconds a rank may lag before the NCCL watchdog aborts every rank.
    trainer:rf_detr:ddp_timeout = 3600

  endblock

endblock

# ==============================================================================
#  Trainer 2: box recipe, selected otherwise
# ==============================================================================
block detector_trainer:adaptive:trainer_2

  trainer:type = ocv_windowed

  block trainer:ocv_windowed

    include common_train_rf_detr.conf

    # Windowing mode, can be disabled, maintain_ar, scale, chip, adaptive
    mode = adaptive

    # Threads for chipping, leave as 0 to auto-estimate
    chip_threads = 0

    chip_width = 720
    chip_step_width = 480
    chip_height = 720
    chip_step_height = 480

    # Adaptive size threshold for chipping
    chip_adaptive_thresh = 1400000

    chips_w_gt_only = true

    # Keep some empty tiles per frame, or the model never sees open water.
    background_chip_ratio = 0.5

    # Don't train on chips with detections smaller than this
    min_train_box_length = 2

    # Remove detections under this area instead of training on them
    small_box_area = 20

    # Uncomment to write JPG chips instead of PNG to save disk.
    #chip_format = jpg

    # ocv, not vxl: the vxl writer corrupts the heap over long runs.
    image_reader:type = ocv

    # The model variant (base, large, small, medium, nano)
    trainer:rf_detr:model_size = large

    # Network perspective field size
    trainer:rf_detr:chip_width = 720

    # RFDETRLarge, box-only. Seeds do not cross with the patch-12 seg model.
    trainer:rf_detr:segmentation = False

    # 704 is the model's pretrained native size; chips are resized to it.
    trainer:rf_detr:resolution = 704

    # Only needed on small cards, which adaptive batch sizing already covers.
    trainer:rf_detr:gradient_checkpointing = False

    trainer:rf_detr:max_epochs = 25

    # downsample thins train but not val, so bound validation.
    trainer:rf_detr:val_subsample = 4000
    trainer:rf_detr:eval_max_dets = 300

    trainer:rf_detr:persistent_workers = False
    trainer:rf_detr:prefetch_factor = 2

  endblock

endblock

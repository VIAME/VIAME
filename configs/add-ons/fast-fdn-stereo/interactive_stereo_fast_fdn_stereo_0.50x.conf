# =============================================================================
# Title: Interactive Stereo - Fast Foundation Stereo 0.50x
#
# Description: Fast-Foundation-Stereo at 0.50 service scale. The ONNX export
# fixes its own input resolution, so this scales the frames handed to the
# service rather than the model.
# Requires GPU.
# =============================================================================

# ---- Base Model Settings -----------------------------------------------------

include interactive_stereo_fast_fdn_stereo.conf

# ---- Scale Override ----------------------------------------------------------

service:scale = 0.50

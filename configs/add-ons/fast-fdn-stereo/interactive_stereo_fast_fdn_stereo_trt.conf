# =============================================================================
# Title: Interactive Stereo - Fast Foundation Stereo (TensorRT)
#
# Description: Same model as interactive_stereo_fast_fdn_stereo.conf, run
# through TensorRT. The plugin uses, in order: an engine shipped next to the
# model (models/fast_foundation_stereo_l.<linux|windows>.engine, built
# hardware/version compatible for Ampere-or-newer GPUs; needs only the lean
# runtime, VIAME_TENSORRT_RUNTIME_ONLY), an engine it built and cached
# earlier, or a fresh build from the .onnx (several minutes, once per GPU and
# TensorRT version; needs the full package, i.e. VIAME_ENABLE_TENSORRT without RUNTIME_ONLY).
# =============================================================================

# ---- Stereo Algorithm -------------------------------------------------------

compute_stereo_depth_map:type = fast_foundation_stereo_onnx

# ---- Model Parameters -------------------------------------------------------

relativepath compute_stereo_depth_map:fast_foundation_stereo_onnx:model_path = models/fast_foundation_stereo_l.onnx
relativepath compute_stereo_depth_map:fast_foundation_stereo_onnx:config_path = models/fast_foundation_stereo_l.yaml
compute_stereo_depth_map:fast_foundation_stereo_onnx:backend = tensorrt
compute_stereo_depth_map:fast_foundation_stereo_onnx:trt_precision = fp32
compute_stereo_depth_map:fast_foundation_stereo_onnx:device = auto
compute_stereo_depth_map:fast_foundation_stereo_onnx:output_mode = disparity
compute_stereo_depth_map:fast_foundation_stereo_onnx:remove_invisible = true

# ---- Service Settings --------------------------------------------------------

service:scale = 1.0

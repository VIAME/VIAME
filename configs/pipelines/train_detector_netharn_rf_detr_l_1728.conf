# =============================================================================
# Title: Train Detector - NetHarn RF DETR Large 1728x960 RGB (boxes)
#
# Description: NetHarn-harness counterpart to
# train_detector_rf_detr_l_1728.conf, for comparing the two training
# methods on the same footage: same RFDETRLarge architecture (2026 ViT-S,
# patch 16), same 1728x960 network input, same validation split, downsample,
# and extracted-frame cache. What differs is everything the harness owns:
# NetHarn trains with SGD + its own scheduler/augmenters/monitor instead of
# the Lightning stack's AdamW + cosine + EMA, so keep the deltas in mind when
# reading the numbers.
#
# The Lightning recipe hands full frames to RF-DETR, which resizes them to
# 960x1728 internally. NetHarn instead samples fixed windows, so this config
# pre-scales frames to the network shape (mode = scale below) and the sampler
# then sees one full-frame window -- the closest equivalent of the same
# pixels reaching the model.
# =============================================================================

include common_train_detector.conf

#  Pipeline template file. Plain RGB deploy template (no motion/flow infusion).
relativepath pipeline_template = templates/embedded_default.pipe

#  Override default validation percentage
default_percent_validation = 0.10

#  Matched to the rf_detr 1728 recipes so the train/val split lands on the
#  same frames.
validation_burst_frame_count = 500

#  Every 3rd extracted frame, matched to the box rf_detr 1728 recipe.
downsample = 3

#  Augmentatation cache.
augmentation_cache = augmented_images

#  Reuse cached frames -- the extraction settings above are identical to the
#  rf_detr 1728 RGB configs, so their cache can be shared.
regenerate_cache = false

#  Algorithm to use for 'detector_trainer'.
detector_trainer:type = ocv_windowed

block detector_trainer:ocv_windowed

  # Directory for all files used in training
  train_directory = deep_training

  # Scale frames down to the network input shape; NetHarn's sampler then
  # draws its 960x1728 window over what is effectively the whole frame.
  mode = scale

  # Network input shape (width x height), both divisible by the large
  # model's patch_size * num_windows = 32 constraint.
  chip_width = 1728
  chip_height = 960

  # Adaptive size threshold for chipping
  chip_adaptive_thresh = 1600000

  # Keep small boxes -- small fish are the target.
  min_train_box_length = 1

  # Image reader type
  image_reader:type = vxl

endblock

block detector_trainer:ocv_windowed:trainer

  # Trainer type
  type = netharn

  # RF-DETR Large through the NetHarn harness. The positional encoding is
  # built for the 960x1728 window below. COCO-pretrained weights are pulled
  # automatically; point netharn:backbone at a checkpoint to seed otherwise.
  netharn:arch = rfdetr_large

  # Number of GPUs to use, -1 indicates all
  netharn:gpu_count = -1

  # Network input window, mapped to detect_fit window_dims (height, width).
  netharn:chip_width = 1728
  netharn:chip_height = 960

  # Horizontal flip only: this is up-is-up footage, and the Lightning recipe
  # deliberately avoids vertical flips. gravity = 1.0 disables the vertical
  # flip inside the 'simple' augmenter; do not use the rotating presets.
  netharn:augmentation = simple
  netharn:gravity = 1.0

  # Matched to the rf_detr 1728 recipes.
  netharn:max_epochs = 20

  # Sized from detected VRAM.
  netharn:batch_size = auto

  # NetHarn trains with SGD, so its auto learning rate applies rather than
  # RF-DETR's AdamW-tuned 1e-4.
  netharn:learning_rate = auto
  netharn:scheduler = auto

  # Dataloader processes per rank.
  netharn:train_workers = 4

  # Max timeout in seconds (default = 1209600, or two weeks)
  netharn:timeout = 1209600

endblock

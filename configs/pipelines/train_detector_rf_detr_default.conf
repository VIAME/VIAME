# =============================================================================
# Title: Train Detector - RF DETR Default (auto-selects boxes vs segmentation)
#
# Description: Auto-selects between the two 720 RF-DETR recipes using the
# adaptive detector trainer's data statistics. When every input annotation
# carries a segmentation polygon or mask, trainer_1 runs -- the
# train_detector_rf_detr_l_seg_720.conf recipe (RFDETRSegLarge, masks +
# boxes). Otherwise trainer_2 runs -- the box-only RFDETRLarge recipe, since
# seg training would see box-only truth for any object missing a polygon.
# Exactly one trainer runs.
#
# Both recipes are spelled out inline below, over the shared
# common_train_rf_detr.conf settings. The seg block is kept in step with the
# standalone train_detector_rf_detr_l_seg_720.conf.
# =============================================================================

include common_train_detector.conf

#  Pipeline template file.
relativepath pipeline_template = templates/embedded_default.pipe

#  Override default validation percentage
default_percent_validation = 0.10

#  Augmentatation cache.
augmentation_cache = augmented_images

#  Reuse cached frames -- WIPE augmented_images first if another config built it.
regenerate_cache = false

#  Algorithm to use for 'detector_trainer'.
detector_trainer:type = adaptive

block detector_trainer:adaptive

  # Run only the best-matching trainer
  max_trainers_to_run = 1

  # Log the computed data statistics and selection reasoning
  verbose = true

endblock

# ==============================================================================
#  Trainer 1: segmentation recipe, selected when every annotation has a
#  polygon or mask
# ==============================================================================
block detector_trainer:adaptive:trainer_1

  required_mask_fraction = 1.0
  prefers_masks = true

  trainer:type = ocv_windowed

  block trainer:ocv_windowed

    include common_train_rf_detr.conf

    # Windowing mode, can be disabled, maintain_ar, scale, chip, adaptive
    mode = adaptive

    # Threads for chipping, leave as 0 to auto-estimate
    chip_threads = 0

    # Chip tile size = 720 (divisible by 24 for seg-large). NOTE: the code reads
    # chip_step_width / chip_step_height (the older chip_width_step /
    # chip_height_step keys were silently ignored and defaulted to 500).
    chip_width = 720
    chip_step_width = 480
    chip_height = 720
    chip_step_height = 480

    # Off by default in the trainer, which writes every tile whether or not it
    # holds a fish -- roughly ten chips per frame on a 720/480 grid, almost all
    # background.
    chips_w_gt_only = true

    # But not only annotated tiles, or the model never sees empty water and fires
    # on it. Per-frame, relative to that frame's annotated chips.
    background_chip_ratio = 0.5

    # Don't train on chips with detections smaller than this
    min_train_box_length = 5

    # Chip output format. Uncomment to write JPG chips (~3x less disk than PNG).
    #chip_format = jpg

    # Image IO type. ocv, not vxl: the vxl writer corrupts the heap over long
    # runs (crashing chip generation and video-frame extraction).
    image_reader:type = ocv

    # The model variant (base, large, small, medium, nano)
    trainer:rf_detr:model_size = large

    # Network perspective field size
    trainer:rf_detr:chip_width = 720

    # Segmentation model RFDETRSegLarge -- learns masks + boxes from the input
    # polygons. patch_size 12 here vs 16 for the box model, so seeds never cross
    # between the two recipes.
    trainer:rf_detr:segmentation = True

    # Network input resolution. Must be divisible by 24 for seg-large (720=24*30).
    trainer:rf_detr:resolution = 720

    # Off: with it on the CPU resizes every image to 840x840, the top of the
    # jitter ladder, for an average the GPU already sees at 720.
    trainer:rf_detr:multi_scale = false

    trainer:rf_detr:max_epochs = 20

    # DataLoader worker processes per rank. Raise toward the core count to keep
    # the batches fed.
    trainer:rf_detr:num_workers = 8

    # Bound validation, which seg forward-passes at batch 1 and would otherwise
    # dominate the epoch when downsample thins train but not val.
    trainer:rf_detr:val_subsample = 4000

    # Seconds a rank may lag before the NCCL watchdog aborts every rank (0 = PTL's
    # 1800). The ranks reporting the timeout are victims; the culprit is the one
    # absent.
    trainer:rf_detr:ddp_timeout = 3600

  endblock

endblock

# ==============================================================================
#  Trainer 2: box recipe, selected otherwise
# ==============================================================================
block detector_trainer:adaptive:trainer_2

  trainer:type = ocv_windowed

  block trainer:ocv_windowed

    include common_train_rf_detr.conf

    # Windowing mode, can be disabled, maintain_ar, scale, chip, adaptive
    mode = adaptive

    # Threads for chipping, leave as 0 to auto-estimate
    chip_threads = 0

    # Chip tile size. NOTE: the code reads chip_step_width / chip_step_height
    # (the older chip_width_step / chip_height_step keys were silently ignored
    # and defaulted to 500).
    chip_width = 720
    chip_step_width = 480
    chip_height = 720
    chip_step_height = 480

    # Adaptive size threshold for chipping
    chip_adaptive_thresh = 1400000

    # Off by default in the trainer, which writes every tile whether or not it
    # holds a fish -- roughly ten chips per frame on a 720/480 grid, almost all
    # background.
    chips_w_gt_only = true

    # But not only annotated tiles, or the model never sees empty water and fires
    # on it. Per-frame, relative to that frame's annotated chips.
    background_chip_ratio = 0.5

    # Don't train on chips with detections smaller than this
    min_train_box_length = 2

    # Remove detections under this area instead of training on them
    small_box_area = 20

    # Chip output format. Uncomment to write JPG chips (~3x less disk than PNG).
    #chip_format = jpg

    # Image IO type. ocv, not vxl: the vxl writer corrupts the heap over long
    # runs (crashing chip generation and video-frame extraction).
    image_reader:type = ocv

    # The model variant (base, large, small, medium, nano)
    trainer:rf_detr:model_size = large

    # Network perspective field size
    trainer:rf_detr:chip_width = 720

    # Box-only detector (RFDETRLarge), input polygons are ignored. patch_size 16
    # here vs 12 for the seg model, so seeds never cross between the two recipes.
    trainer:rf_detr:segmentation = False

    # Network input resolution. Must be divisible by 32 for box-large; 704 is its
    # pretrained native size, so the 720px chips are resized 720 -> 704.
    trainer:rf_detr:resolution = 704

    # Trade compute for memory: recompute backbone activations in the backward
    # pass. Only needed on small cards, which adaptive already sizes down for.
    trainer:rf_detr:gradient_checkpointing = False

    trainer:rf_detr:max_epochs = 25

    # downsample thins train but leaves validation whole, so the vali set is much
    # larger than default_percent_validation implies.
    trainer:rf_detr:val_subsample = 4000
    trainer:rf_detr:eval_max_dets = 300

    trainer:rf_detr:persistent_workers = False
    trainer:rf_detr:prefetch_factor = 2

  endblock

endblock

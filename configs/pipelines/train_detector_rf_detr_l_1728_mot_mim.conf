# =============================================================================
# Title: Train Detector - RF DETR Large 1728x960 Motion (MIM)
#
# Description: RFDETRLarge box model at 1728x960 with motion-image-method
# infusion: imagery gains two temporal-variance channels
# (train_aug_add_double_motion) and the detector deploys with the matching
# motion template. Requires temporally ordered input frames.
#
# BOX, NOT SEG. The run warm-starts from the prior MIM box weights, which is
# only possible with segmentation off: RFDETRSegLarge is patch_size 12 to
# RFDETRLarge's 16, so rf-detr rejects the patch-16 seed outright. Even the 89%
# of parameters that match by shape are trained on patch-16 tokens, so nothing
# survives re-tokenizing at stride 12. mot_opt is the seg variant.
# =============================================================================

include common_train_detector.conf

#  Pipeline template file.
relativepath pipeline_template = templates/embedded_rf_detr_motion.pipe

#  Override default validation percentage
default_percent_validation = 0.10

#  500 frames (~17s) decorrelates a burst from the training footage around it.
validation_burst_frame_count = 500

#  Every 8th extracted frame: at 5 fps neighbours are near duplicates. Divides
#  optimizer steps per epoch by 8 -- raise max_epochs if that binds.
downsample = 8

#  Single-pass and source-driven, so videos are decoded once and image
#  sequences work through the same path.
relativepath augmentation_pipeline = train_aug_add_double_motion.pipe

#  Augmentatation cache.
augmentation_cache = augmented_images

#  Rebuild rather than reuse: the three motion configs share this directory
#  name with different channel layouts. Flip to false once the cache is known
#  good, or every later run re-extracts all 504 items.
regenerate_cache = true

#  Algorithm to use for 'detector_trainer'.
detector_trainer:type = ocv_windowed

block detector_trainer:ocv_windowed

  # Directory for all files used in training
  train_directory = deep_training

  # Windowing mode, can be disabled, maintain_ar, scale, chip, adaptive
  mode = disabled

  # Unused while mode = disabled; RF-DETR does the resize. Kept aligned anyway.
  chip_width = 1728
  chip_width_step = 1152

  chip_height = 960
  chip_height_step = 640

  # Adaptive size threshold for chipping
  chip_adaptive_thresh = 1600000

  # Keep small boxes -- small fish are the target.
  min_train_box_length = 1
  #small_box_area = 200
  #small_action = remove

  # Image reader type
  image_reader:type = vxl

endblock

block detector_trainer:ocv_windowed:trainer

  # Trainer type
  type = rf_detr

  # The model variant (base, large, small, medium, nano)
  rf_detr:model_size = large

  # Must stay False to warm-start from seed_model -- see the header.
  rf_detr:segmentation = False

  # Device to train on (auto, cpu, cuda, cuda:N)
  rf_detr:device = auto

  # HEIGHTxWIDTH, divisible by the large model's 32 and matching the seed, so
  # its positional-encoding grid is reused rather than interpolated.
  rf_detr:resolution = 960x1728

  # Off: it resizes every image to the top of the jitter ladder on CPU and
  # re-interpolates down on GPU, 1.36x the pixel cost for the same average.
  rf_detr:multi_scale = false

  # For the [ motion, grey, motion ] layout: geometry on all three channels, no
  # vertical flip; brightness/contrast/gamma on the centre channel only, since
  # an additive offset on motion energy invents motion in a still background.
  # The variance channels share one multiplicative gain, so 0 stays 0.
  rf_detr:augmentation = motion_grey

  # Prior MIM box model rather than COCO: same architecture, resolution, class
  # and channel layout, 316992 steps in, so the load is exact. Clear to use
  # RF-DETR's COCO weights instead.
  relativepath rf_detr:seed_model = models/fish_rf_detr_variance_1728.pth

  # The LR sees batch_size * grad_accum_steps * num_gpus; adaptive sizes the
  # micro-batch to VRAM and accumulates to hold that product at 32 -- the seed's
  # own global batch, which is why the LRs below match its recorded ones. 8 per
  # device rather than the seg configs' 4 because there is no mask head.
  rf_detr:batch_size = adaptive
  rf_detr:auto_batch_target_effective = 32

  # Matched to the flow and all-motion configs so the three differ only in
  # channels. Short for a fast first pass.
  rf_detr:max_epochs = 20

  # The seed's own bases, read from its stored args: RF-DETR's tuned values
  # scaled by sqrt(2) for the global batch of 32 -- sqrt not linear, since DETR
  # is unstable at high LR. Everything below is relative to these.
  rf_detr:learning_rate = 1.5e-4
  rf_detr:learning_rate_encoder = 2e-4

  # Shallower than the seed's own 0.8/0.7 but not flat: flat handed the first
  # ViT block 25x its previous LR and cost the opt run most of its accuracy in
  # one epoch. This puts the trunk at 1.9x-6.8x the seed's schedule.
  rf_detr:lr_vit_layer_decay = 0.9
  rf_detr:lr_component_decay = 0.85

  # Unlike opt and all. Here all three channels are [ motion, grey, motion ], so
  # the stem is the only translator into an RGB-pretrained trunk and rewriting
  # it invalidates every downstream feature at once -- pinning it at 1.5e-4
  # (35x) took the seed from ~0.65 mAP to 0.034 in one epoch. This is half that,
  # still 17x the seed's 4.3e-6. Set 0 to leave the stem on the ladder.
  rf_detr:lr_stem = 7.5e-5

  # Nothing is re-initialized, but the trunk still starts 1.9-6.8x faster than
  # the seed's schedule, so ramp over a full epoch.
  rf_detr:warmup_epochs = 1.0

  # Cosine anneals to 0 across max_epochs; "step" drops at 100 and never fires.
  rf_detr:lr_scheduler = cosine

  # Applied per optimizer step, so the horizon is ~1/(1-decay) steps; the old
  # 0.993 averaged over ~140, well under 1% of an epoch here.
  rf_detr:use_ema = True
  rf_detr:ema_decay = 0.9998

  # Checkpointing
  rf_detr:checkpoint_interval = 5

  # Every DDP rank forks num_workers loaders each holding prefetch_factor *
  # batch_size decoded images; that product is what exhausts host RAM (the rank
  # is SIGKILLed, not a CUDA OOM). persistent_workers off reaps the validation
  # workers between epochs.
  rf_detr:num_workers = 4
  rf_detr:pin_memory = True
  rf_detr:persistent_workers = False
  rf_detr:prefetch_factor = 2

  # A six-figure validation set at 0.10 would hold eval_max_dets per image in
  # host RAM. Deterministic subsample for model selection; full eval on the
  # final best checkpoint for a headline number.
  rf_detr:val_subsample = 4000
  rf_detr:eval_max_dets = 300

  # Seconds a rank may lag before the NCCL watchdog SIGABRTs every rank. The
  # 30-minute default is short enough that one slow rank kills a multi-day run.
  # The ranks reporting the timeout are victims; the culprit is the one missing.
  rf_detr:ddp_timeout = 3600

  # Max timeout in seconds (default = 1209600, or two weeks)
  rf_detr:timeout = 1209600

endblock

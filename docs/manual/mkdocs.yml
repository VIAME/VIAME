site_name: VIAME
site_description: Video and Image Analytics for Multiple Environments
site_author: Kitware

repo_url: https://github.com/VIAME/VIAME

docs_dir: mkdocs
site_dir: _build/mkdocs

# Pages keep the sections/<name>.html addresses the Sphinx manual uses
use_directory_urls: false

# Adds the example READMEs and the DIVE manual to the pages in docs_dir
hooks:
  - mkdocs_hooks.py

watch:
  - sections
  - _static
  - dive_docs.py
  - mkdocs_hooks.py
  - ../../examples
  - ../command_line_interface.md
  - ../python_package.md

theme:
  name: material
  logo: logo.png
  favicon: favicon.ico
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - search.highlight

extra_css: [extra.css]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - smarty
  - tables
  - toc:
      permalink: true
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/VIAME/VIAME
    - icon: fontawesome/brands/docker
      link: https://hub.docker.com/r/kitware/viame
    - icon: fontawesome/brands/discourse
      link: https://discourse.kitware.com/c/viame-dive/17
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/channel/UCpfxPoR5cNyQFLmqlrxyKJw

validation:
  nav:
    omitted_files: info
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: info

nav:
  - Documentation Overview: index.md
  - sections/quick_start_guide.md
  - sections/installing_from_binaries.md
  - sections/building_from_source.md
  - sections/annotation_and_visualization.md
  - DIVE Interface:
    - sections/dive/index.md
    - Getting Started:
      - Web Version: sections/dive/Web-Version.md
      - Desktop Version: sections/dive/Dive-Desktop.md
      - Annotation Quickstart: sections/dive/Annotation-QuickStart.md
    - Annotation Interface:

# =============================================================================
# Settings shared by every RF-DETR training recipe. Keys are relative to the
# detector_trainer:ocv_windowed block: include this file (directly, or via a
# more specific common_train_rf_detr_* recipe) inside that block, then
# override individual keys after the include.
# =============================================================================

# Directory for all files used in training
train_directory = deep_training

# Adaptive size threshold for chipping
chip_adaptive_thresh = 1600000

# Remove detections under this area instead of training on them. Override
# with small_action = none to keep small boxes.
small_box_area = 75
small_action = remove

# Trainer type
trainer:type = rf_detr

# Device to train on (auto, cpu, cuda, cuda:N). auto = every visible GPU, DDP.
trainer:rf_detr:device = auto

# Path to pretrained weights. Leave empty to fine-tune from RF-DETR's default
# COCO-pretrained weights.
trainer:rf_detr:seed_model =

# Augmentation preset: default, geometric, none, conservative, aggressive,
# aerial, or industrial. "default" uses RF-DETR's built-in augmentation.
#trainer:rf_detr:augmentation = default

# Micro-batch sized from the detected VRAM, with grad_accum_steps derived so
# the GLOBAL batch (micro-batch x grad_accum x GPUs) holds at the target
# below, which is what the learning rates are tuned for. Replace with a fixed
# integer plus trainer:rf_detr:grad_accum_steps to pin it, or "auto" to have
# RF-DETR probe the real model instead of estimating from the card size.
trainer:rf_detr:batch_size = adaptive
trainer:rf_detr:auto_batch_target_effective = 16

# Training learning rates, tuned for the effective batch of 16 above. Never
# scaled by world size; scale by ~sqrt(target/16) if raising the target.
trainer:rf_detr:learning_rate = 1e-4
trainer:rf_detr:learning_rate_encoder = 1.5e-4

# The head is re-initialized to the new class count, so the first few hundred
# steps push large gradients through an otherwise-pretrained network. Ramp in.
trainer:rf_detr:warmup_epochs = 0.25

# LR schedule. Without this the trainer falls back to "step", which drops the
# LR once at lr_drop = 100 -- an epoch these runs never reach, so the LR would
# hold at its peak from first step to last. Cosine anneals to 0 across
# max_epochs, whatever max_epochs happens to be.
trainer:rf_detr:lr_scheduler = cosine

# EMA settings
trainer:rf_detr:use_ema = True
trainer:rf_detr:ema_decay = 0.993

# Checkpointing
trainer:rf_detr:checkpoint_interval = 10

# Max timeout in seconds (default = 1209600, or two weeks)
trainer:rf_detr:timeout = 1209600
